<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="450" fill="#ffffff"/>

  <!-- Region -->
  <rect x="20" y="20" width="484" height="410" rx="10" fill="#F7F9FB" stroke="#3F6EA6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="42" y="48" font-size="17" font-weight="650" fill="#3F6EA6">Región</text>
  <text x="42" y="70" font-size="14" fill="#5B7C99">ejemplo: sa-east-1 (São Paulo)</text>

  <!-- AZ 1 -->
  <rect x="44" y="90" width="436" height="98" rx="8" fill="#ffffff" stroke="#5B7C99" stroke-width="2"/>
  <text x="64" y="118" font-size="15" font-weight="600" fill="#17222B">Zona de disponibilidad A</text>
  <rect x="64" y="130" width="120" height="40" rx="5" fill="#EAF3EA" stroke="#2E7D5B" stroke-width="1.5"/>
  <text x="124" y="155" font-size="13" text-anchor="middle" fill="#1F5B41">centro de datos</text>
  <rect x="196" y="130" width="120" height="40" rx="5" fill="#EAF3EA" stroke="#2E7D5B" stroke-width="1.5"/>
  <text x="256" y="155" font-size="13" text-anchor="middle" fill="#1F5B41">centro de datos</text>

  <!-- AZ 2 -->
  <rect x="44" y="202" width="436" height="98" rx="8" fill="#ffffff" stroke="#5B7C99" stroke-width="2"/>
  <text x="64" y="230" font-size="15" font-weight="600" fill="#17222B">Zona de disponibilidad B</text>
  <rect x="64" y="242" width="120" height="40" rx="5" fill="#EAF3EA" stroke="#2E7D5B" stroke-width="1.5"/>
  <text x="124" y="267" font-size="13" text-anchor="middle" fill="#1F5B41">centro de datos</text>

  <!-- AZ 3 -->
  <rect x="44" y="314" width="436" height="98" rx="8" fill="#ffffff" stroke="#5B7C99" stroke-width="2"/>
  <text x="64" y="342" font-size="15" font-weight="600" fill="#17222B">Zona de disponibilidad C</text>
  <rect x="64" y="354" width="120" height="40" rx="5" fill="#EAF3EA" stroke="#2E7D5B" stroke-width="1.5"/>
  <text x="124" y="379" font-size="13" text-anchor="middle" fill="#1F5B41">centro de datos</text>

  <text x="336" y="262" font-size="13" text-anchor="middle" fill="#5B7C99">separadas físicamente,</text>
  <text x="336" y="280" font-size="13" text-anchor="middle" fill="#5B7C99">unidas por red de baja latencia</text>

  <!-- Ubicaciones de borde -->
  <rect x="524" y="20" width="176" height="410" rx="10" fill="#F7F9FB" stroke="#7B4FA8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="612" y="48" font-size="16" font-weight="650" text-anchor="middle" fill="#4A2E66">Ubicaciones</text>
  <text x="612" y="68" font-size="16" font-weight="650" text-anchor="middle" fill="#4A2E66">de borde</text>

  <rect x="546" y="92" width="132" height="44" rx="6" fill="#EDE3F5" stroke="#7B4FA8" stroke-width="1.5"/>
  <text x="612" y="120" font-size="14" text-anchor="middle" fill="#4A2E66">Bogotá</text>
  <rect x="546" y="150" width="132" height="44" rx="6" fill="#EDE3F5" stroke="#7B4FA8" stroke-width="1.5"/>
  <text x="612" y="178" font-size="14" text-anchor="middle" fill="#4A2E66">Lima</text>
  <rect x="546" y="208" width="132" height="44" rx="6" fill="#EDE3F5" stroke="#7B4FA8" stroke-width="1.5"/>
  <text x="612" y="236" font-size="14" text-anchor="middle" fill="#4A2E66">Ciudad de México</text>

  <text x="612" y="300" font-size="13" text-anchor="middle" fill="#5B7C99">más numerosas</text>
  <text x="612" y="320" font-size="13" text-anchor="middle" fill="#5B7C99">que las regiones</text>
  <text x="612" y="348" font-size="13" text-anchor="middle" fill="#5B7C99">sirven contenido</text>
  <text x="612" y="368" font-size="13" text-anchor="middle" fill="#5B7C99">en caché cerca</text>
  <text x="612" y="388" font-size="13" text-anchor="middle" fill="#5B7C99">del usuario</text>
</svg>
