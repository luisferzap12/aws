<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>

  <!-- Nube / Region -->
  <rect x="16" y="16" width="688" height="408" rx="10" fill="#F7F9FB" stroke="#3F6EA6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="34" y="42" font-size="17" font-weight="600" fill="#3F6EA6">Región AWS</text>

  <!-- VPC -->
  <rect x="40" y="56" width="640" height="348" rx="8" fill="#ffffff" stroke="#5B7C99" stroke-width="2"/>
  <text x="58" y="80" font-size="16" font-weight="600" fill="#17222B">VPC 10.0.0.0/16</text>

  <!-- Internet Gateway -->
  <rect x="300" y="96" width="150" height="42" rx="6" fill="#EDE3F5" stroke="#7B4FA8" stroke-width="2"/>
  <text x="375" y="123" font-size="15" text-anchor="middle" fill="#4A2E66">Internet Gateway</text>

  <!-- Internet -->
  <circle cx="375" cy="34" r="0" fill="none"/>
  <text x="375" y="42" font-size="15" text-anchor="middle" fill="#5B7C99">Internet</text>
  <line x1="375" y1="50" x2="375" y2="96" stroke="#5B7C99" stroke-width="2"/>

  <!-- Subred publica -->
  <rect x="62" y="164" width="290" height="216" rx="6" fill="#EAF3EA" stroke="#2E7D5B" stroke-width="2"/>
  <text x="80" y="188" font-size="15" font-weight="600" fill="#1F5B41">Subred pública 10.0.1.0/24</text>

  <rect x="110" y="216" width="196" height="52" rx="6" fill="#ffffff" stroke="#2E7D5B" stroke-width="2"/>
  <text x="208" y="248" font-size="15" text-anchor="middle" fill="#17222B">? ? ?</text>

  <rect x="110" y="300" width="196" height="48" rx="6" fill="#ffffff" stroke="#8C96A0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="208" y="330" font-size="14" text-anchor="middle" fill="#5B7C99">Tabla de rutas → IGW</text>

  <!-- Subred privada -->
  <rect x="376" y="164" width="290" height="216" rx="6" fill="#FDF1E7" stroke="#E8873A" stroke-width="2"/>
  <text x="394" y="188" font-size="15" font-weight="600" fill="#96541B">Subred privada 10.0.2.0/24</text>

  <rect x="424" y="216" width="196" height="52" rx="6" fill="#ffffff" stroke="#E8873A" stroke-width="2"/>
  <text x="522" y="240" font-size="15" text-anchor="middle" fill="#17222B">EC2 (app)</text>
  <text x="522" y="258" font-size="13" text-anchor="middle" fill="#5B7C99">sin IP pública</text>

  <rect x="424" y="300" width="196" height="48" rx="6" fill="#ffffff" stroke="#8C96A0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="522" y="330" font-size="14" text-anchor="middle" fill="#5B7C99">Tabla de rutas → ?</text>

  <!-- Flechas -->
  <defs>
    <marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#5B7C99"/>
    </marker>
  </defs>
  <line x1="208" y1="216" x2="208" y2="150" stroke="#5B7C99" stroke-width="2" marker-end="url(#f)"/>
  <line x1="208" y1="150" x2="296" y2="126" stroke="#5B7C99" stroke-width="2" marker-end="url(#f)"/>
  <line x1="424" y1="242" x2="310" y2="242" stroke="#5B7C99" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <text x="366" y="234" font-size="13" text-anchor="middle" fill="#5B7C99">tráfico</text>
  <text x="366" y="284" font-size="13" text-anchor="middle" fill="#5B7C99">saliente</text>
</svg>
