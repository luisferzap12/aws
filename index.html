sobre sus propios recursos en AWS?","opciones":["Consultar la política de pruebas de AWS, que ya permite varios servicios sin autorización previa","Solicitar siempre permiso por escrito con 90 días de antelación","Contratar obligatoriamente el plan Enterprise","Nada, cualquier prueba está permitida sin restricciones"],"correctas":[0],"explicacion":"AWS permite pruebas sobre una lista de servicios definida sin aprobación previa, pero prohíbe expresamente ataques de denegación de servicio y pruebas sobre infraestructura de otros clientes.","referencia":"Política de pruebas de penetración"},{"id":"tec-15","dominio":"tecnologia","enunciado":"¿Qué es una AMI de Amazon EC2?","opciones":["Una plantilla con el sistema operativo y el software desde la que se lanzan instancias","Un tipo de instancia optimizada para memoria","Un volumen de almacenamiento en bloque","Una política de escalado automático"],"correctas":[0],"explicacion":"La imagen de máquina de Amazon define el punto de partida de la instancia. Crear una AMI propia con el software ya instalado acelera el arranque cuando el grupo de Auto Scaling añade instancias.","referencia":"EC2 · AMI"},{"id":"tec-16","dominio":"tecnologia","enunciado":"Una carga de trabajo necesita mucha memoria RAM para una base de datos en memoria. ¿Qué familia de instancias EC2 corresponde?","opciones":["Optimizadas para cómputo","Optimizadas para memoria","Optimizadas para almacenamiento","De propósito general"],"correctas":[1],"explicacion":"Las familias existen para no pagar por lo que no usas. Cómputo para procesamiento intensivo, memoria para bases de datos y cachés, almacenamiento para trabajos con mucha lectura y escritura en disco.","referencia":"EC2 · Familias de instancias"},{"id":"tec-17","dominio":"tecnologia","enunciado":"¿Qué servicio ofrece servidores virtuales, almacenamiento y red a un precio mensual fijo, pensado para proyectos sencillos?","opciones":["Amazon Lightsail","Amazon EC2","AWS Fargate","AWS Outposts"],"correctas":[0],"explicacion":"Lightsail agrupa los recursos en planes de precio predecible y con plantillas listas, como WordPress. Es la puerta de entrada para quien no necesita la flexibilidad de EC2.","referencia":"Amazon Lightsail"},{"id":"tec-18","dominio":"tecnologia","enunciado":"¿Qué permite ejecutar contenedores sin administrar los servidores subyacentes?","opciones":["AWS Fargate","Amazon EC2","AWS Outposts","Amazon Lightsail"],"correctas":[0],"explicacion":"Fargate es el modo sin servidor para contenedores y funciona tanto con ECS como con EKS. Defines cuánta CPU y memoria necesita la tarea, y no hay instancias que parchear.","referencia":"AWS Fargate"},{"id":"tec-19","dominio":"tecnologia","enunciado":"¿Qué servicio ejecuta Kubernetes gestionado en AWS?","opciones":["Amazon ECS","Amazon EKS","AWS Batch","AWS Lambda"],"correctas":[1],"explicacion":"EKS ejecuta Kubernetes estándar, útil si el equipo ya lo conoce o quiere portabilidad. ECS es el orquestador propio de AWS, más simple pero atado a su ecosistema.","referencia":"Amazon EKS"},{"id":"tec-20","dominio":"tecnologia","enunciado":"Una empresa necesita ejecutar servicios de AWS dentro de su propio centro de datos por requisitos de latencia. ¿Qué opción existe?","opciones":["AWS Outposts","AWS Direct Connect","Amazon Lightsail","AWS Local Zones"],"correctas":[0],"explicacion":"Outposts lleva hardware de AWS a tus instalaciones, gestionado por AWS y con las mismas API. Es la respuesta típica del examen cuando aparecen las palabras \"en las instalaciones del cliente\".","referencia":"AWS Outposts"},{"id":"tec-21","dominio":"tecnologia","enunciado":"¿Qué clase de almacenamiento de S3 conviene para datos a los que se accede pocas veces al mes pero que deben recuperarse al instante?","opciones":["S3 Standard-Infrequent Access","S3 Standard","S3 Glacier Deep Archive","S3 Express One Zone"],"correctas":[0],"explicacion":"Standard-IA cobra menos por almacenamiento y algo más por recuperación. Compensa cuando el acceso es poco frecuente pero necesitas el objeto de inmediato.","referencia":"S3 · Clases de almacenamiento"},{"id":"tec-22","dominio":"tecnologia","enunciado":"¿Qué clase de S3 mueve los objetos entre niveles de acceso automáticamente según cómo se usen?","opciones":["S3 Intelligent-Tiering","S3 Standard","S3 One Zone-Infrequent Access","S3 Glacier Flexible Retrieval"],"correctas":[0],"explicacion":"Intelligent-Tiering cobra una pequeña tarifa de supervisión y traslada cada objeto al nivel más barato según su patrón de acceso. Sirve cuando no sabes de antemano qué datos se van a consultar.","referencia":"S3 · Intelligent-Tiering"},{"id":"tec-23","dominio":"tecnologia","enunciado":"¿Qué permite el versionado de un bucket de S3?","opciones":["Conservar copias anteriores de un objeto, de modo que se pueda recuperar tras una sobrescritura o borrado","Cifrar cada objeto con una clave distinta","Replicar el bucket en otra región","Comprimir automáticamente los archivos"],"correctas":[0],"explicacion":"Con versionado activo, borrar un objeto solo coloca un marcador y la versión anterior sigue ahí. Es la protección más directa contra el error humano y contra el ransomware.","referencia":"S3 · Versionado"},{"id":"tec-24","dominio":"tecnologia","enunciado":"¿Para qué sirve una regla de ciclo de vida en S3?","opciones":["Mover objetos a clases más baratas o eliminarlos automáticamente según su antigüedad","Restringir quién puede leer el bucket","Acelerar las cargas desde otro continente","Crear una copia en otra cuenta"],"correctas":[0],"explicacion":"El ciclo de vida automatiza lo que de otro modo nadie haría a mano: pasar los registros a Glacier a los 90 días y borrarlos a los siete años, por ejemplo.","referencia":"S3 · Ciclo de vida"},{"id":"tec-25","dominio":"tecnologia","enunciado":"¿Qué es una instantánea de EBS?","opciones":["Una copia de seguridad incremental del volumen, almacenada en S3 y gestionada por AWS","Una copia del sistema operativo lista para lanzar instancias","Un registro de las llamadas a la API","Una réplica sincrónica en otra zona de disponibilidad"],"correctas":[0],"explicacion":"Las instantáneas son incrementales: solo guardan los bloques que cambiaron desde la anterior. Sirven además para mover un volumen a otra zona de disponibilidad o región.","referencia":"EBS · Instantáneas"},{"id":"tec-26","dominio":"tecnologia","enunciado":"¿Qué caracteriza al almacén de instancia (instance store) de EC2?","opciones":["Es almacenamiento físicamente conectado al servidor y sus datos se pierden al detener la instancia","Persiste aunque la instancia se termine","Se puede conectar a varias instancias a la vez","Se cobra por gigabyte transferido"],"correctas":[0],"explicacion":"Es muy rápido porque está en el mismo servidor, pero efímero. Sirve para cachés y archivos temporales, nunca para datos que debas conservar.","referencia":"EC2 · Almacén de instancia"},{"id":"tec-27","dominio":"tecnologia","enunciado":"¿Qué servicio conecta un centro de datos propio con AWS ofreciendo almacenamiento en la nube con acceso local?","opciones":["AWS Storage Gateway","AWS Direct Connect","Amazon EFS","AWS DataSync"],"correctas":[0],"explicacion":"Storage Gateway presenta almacenamiento de AWS a las aplicaciones locales con protocolos que ya entienden, como NFS o iSCSI, manteniendo una caché local para lo que más se usa.","referencia":"AWS Storage Gateway"},{"id":"tec-28","dominio":"tecnologia","enunciado":"¿Qué es Amazon Aurora?","opciones":["Una base de datos relacional compatible con MySQL y PostgreSQL, creada por AWS para la nube","Una base de datos NoSQL de documentos","Un almacén de datos para analítica","Una caché en memoria"],"correctas":[0],"explicacion":"Aurora ofrece un rendimiento varias veces superior al de los motores estándar y replica los datos entre zonas de disponibilidad de forma automática. Se administra desde RDS.","referencia":"Amazon Aurora"},{"id":"tec-29","dominio":"tecnologia","enunciado":"¿Qué servicio ofrece una caché en memoria compatible con Redis o Memcached?","opciones":["Amazon ElastiCache","Amazon DynamoDB","Amazon Neptune","Amazon Redshift"],"correctas":[0],"explicacion":"ElastiCache guarda en memoria los resultados que se consultan una y otra vez, reduciendo la carga de la base de datos y la latencia de la aplicación.","referencia":"Amazon ElastiCache"},{"id":"tec-30","dominio":"tecnologia","enunciado":"¿Qué servicio es una base de datos de grafos, útil para redes sociales o motores de recomendación?","opciones":["Amazon Neptune","Amazon DocumentDB","Amazon Timestream","Amazon Keyspaces"],"correctas":[0],"explicacion":"Neptune está optimizado para consultas sobre relaciones entre entidades. DocumentDB es para documentos tipo MongoDB y Timestream para series temporales.","referencia":"Amazon Neptune"},{"id":"tec-31","dominio":"tecnologia","enunciado":"Una aplicación con DynamoDB necesita bajar la latencia de lectura de milisegundos a microsegundos. ¿Qué se agrega?","opciones":["DynamoDB Accelerator (DAX)","Una réplica de lectura de RDS","Amazon CloudFront","Un balanceador de carga de red"],"correctas":[0],"explicacion":"DAX es una caché en memoria diseñada específicamente para DynamoDB y no requiere cambiar la lógica de la aplicación más allá del cliente.","referencia":"DynamoDB · DAX"},{"id":"tec-32","dominio":"tecnologia","enunciado":"¿Qué servicio permite registrar un dominio y dirigir el tráfico según latencia, geolocalización o estado de salud?","opciones":["Amazon Route 53","Amazon CloudFront","AWS Global Accelerator","Amazon VPC"],"correctas":[0],"explicacion":"Route 53 es el DNS de AWS y además registrador de dominios. Sus políticas de enrutamiento permiten mandar a cada usuario al destino más adecuado.","referencia":"Amazon Route 53"},{"id":"tec-33","dominio":"tecnologia","enunciado":"¿Qué proporciona AWS Direct Connect?","opciones":["Una conexión de red dedicada y privada entre el centro de datos del cliente y AWS","Una VPN cifrada sobre internet","Un balanceador de carga entre regiones","Una red de entrega de contenido"],"correctas":[0],"explicacion":"Direct Connect ofrece ancho de banda constante y latencia predecible porque no pasa por internet público. Una VPN de sitio a sitio es más barata y rápida de montar, pero comparte internet.","referencia":"AWS Direct Connect"},{"id":"tec-34","dominio":"tecnologia","enunciado":"¿Qué servicio simplifica la conexión de muchas VPC y redes locales a través de un punto central?","opciones":["AWS Transit Gateway","Emparejamiento de VPC","AWS Direct Connect","Amazon Route 53"],"correctas":[0],"explicacion":"Sin Transit Gateway, conectar muchas VPC entre sí exige emparejamientos uno a uno que crecen de forma explosiva. El Transit Gateway funciona como un concentrador.","referencia":"AWS Transit Gateway"},{"id":"tec-35","dominio":"tecnologia","enunciado":"¿Qué diferencia a un balanceador de carga de aplicaciones de uno de red?","opciones":["El de aplicaciones trabaja con HTTP y HTTPS y puede enrutar por ruta o dominio; el de red trabaja a nivel TCP con latencia muy baja","El de red solo funciona dentro de una zona de disponibilidad","El de aplicaciones no admite HTTPS","No hay diferencia funcional, solo de precio"],"correctas":[0],"explicacion":"El de aplicaciones entiende el contenido de la petición, así que puede mandar `/api` a un grupo y `/web` a otro. El de red es más rápido pero no lee la solicitud.","referencia":"Elastic Load Balancing"},{"id":"tec-36","dominio":"tecnologia","enunciado":"¿Qué servicio publica mensajes a muchos suscriptores a la vez, por ejemplo correo, SMS o funciones Lambda?","opciones":["Amazon SNS","Amazon SQS","AWS Step Functions","Amazon MQ"],"correctas":[0],"explicacion":"SNS sigue el patrón de publicación y suscripción: un mensaje llega a todos los suscriptores del tema. SQS es una cola donde cada mensaje lo procesa un único consumidor.","referencia":"Amazon SNS"},{"id":"tec-37","dominio":"tecnologia","enunciado":"¿Qué servicio coordina varios pasos de un flujo de trabajo con estados, reintentos y ramificaciones?","opciones":["AWS Step Functions","Amazon SQS","Amazon EventBridge","AWS Batch"],"correctas":[0],"explicacion":"Step Functions describe el flujo como una máquina de estados visual, con control de errores y reintentos integrados. Evita escribir esa coordinación dentro del código.","referencia":"AWS Step Functions"},{"id":"tec-38","dominio":"tecnologia","enunciado":"¿Qué servicio crea, publica y protege API para que las aplicaciones accedan a la lógica de negocio?","opciones":["Amazon API Gateway","Elastic Load Balancing","Amazon CloudFront","AWS AppSync"],"correctas":[0],"explicacion":"API Gateway gestiona autenticación, limitación de velocidad y versiones de la API, y se combina habitualmente con Lambda para construir aplicaciones sin servidor.","referencia":"Amazon API Gateway"},{"id":"tec-39","dominio":"tecnologia","enunciado":"¿Qué servicio ingiere y procesa flujos de datos en tiempo real, como telemetría o registros de clics?","opciones":["Amazon Kinesis","Amazon Redshift","AWS Glue","Amazon Athena"],"correctas":[0],"explicacion":"Kinesis está diseñado para datos que llegan de forma continua y hay que procesar en el momento. Redshift analiza datos ya almacenados.","referencia":"Amazon Kinesis"},{"id":"tec-40","dominio":"tecnologia","enunciado":"¿Qué servicio permite consultar datos guardados en S3 con SQL, sin cargarlos en una base de datos?","opciones":["Amazon Athena","Amazon Redshift","AWS Glue","Amazon QuickSight"],"correctas":[0],"explicacion":"Athena es sin servidor y cobra por los datos que escanea cada consulta. Es la vía más rápida para explorar registros que ya están en S3.","referencia":"Amazon Athena"},{"id":"tec-41","dominio":"tecnologia","enunciado":"¿Qué servicio de AWS sirve para crear paneles e informes de inteligencia de negocio?","opciones":["Amazon QuickSight","Amazon Athena","AWS Glue","Amazon Redshift"],"correctas":[0],"explicacion":"QuickSight es la herramienta de visualización, equivalente a Power BI o Tableau dentro del ecosistema de AWS.","referencia":"Amazon QuickSight"},{"id":"tec-42","dominio":"tecnologia","enunciado":"¿Qué servicio permite describir la infraestructura como código y desplegarla de forma repetible?","opciones":["AWS CloudFormation","AWS Systems Manager","AWS Config","AWS OpsWorks"],"correctas":[0],"explicacion":"CloudFormation toma una plantilla en YAML o JSON y crea todos los recursos como una pila. Si algo falla, revierte los cambios, y eliminar la pila elimina todo lo que creó.","referencia":"AWS CloudFormation"},{"id":"tec-43","dominio":"tecnologia","enunciado":"Un desarrollador quiere subir su código y que AWS aprovisione el entorno completo sin configurar nada. ¿Qué servicio usa?","opciones":["AWS Elastic Beanstalk","AWS CloudFormation","Amazon EC2","AWS Fargate"],"correctas":[0],"explicacion":"Elastic Beanstalk crea las instancias, el balanceador y el escalado a partir del código. Sigues teniendo acceso a los recursos por debajo si necesitas ajustarlos.","referencia":"AWS Elastic Beanstalk"},{"id":"tec-44","dominio":"tecnologia","enunciado":"¿Qué servicio centraliza la administración de instancias, como aplicar parches o ejecutar comandos en flotas completas?","opciones":["AWS Systems Manager","AWS Config","Amazon Inspector","AWS CloudFormation"],"correctas":[0],"explicacion":"Systems Manager permite parchear, ejecutar comandos y guardar parámetros de configuración en cientos de instancias sin conectarse a cada una por SSH.","referencia":"AWS Systems Manager"},{"id":"tec-45","dominio":"tecnologia","enunciado":"¿Dónde se consulta si una interrupción afecta específicamente a los recursos de tu cuenta?","opciones":["AWS Health Dashboard","Amazon CloudWatch","AWS Trusted Advisor","AWS Config"],"correctas":[0],"explicacion":"El Health Dashboard muestra tanto el estado general de los servicios como los eventos que afectan a tus recursos concretos, incluidos avisos de mantenimiento programado.","referencia":"AWS Health Dashboard"},{"id":"tec-46","dominio":"tecnologia","enunciado":"¿Qué servicio recomienda tipos de instancia más adecuados analizando el uso real de tus recursos?","opciones":["AWS Compute Optimizer","AWS Trusted Advisor","Amazon CloudWatch","AWS Budgets"],"correctas":[0],"explicacion":"Compute Optimizer usa aprendizaje automático sobre las métricas históricas para señalar instancias sobredimensionadas o insuficientes, con la recomendación concreta.","referencia":"AWS Compute Optimizer"},{"id":"tec-47","dominio":"tecnologia","enunciado":"¿Qué servicio permite construir, entrenar y desplegar modelos de aprendizaje automático?","opciones":["Amazon SageMaker","Amazon Rekognition","Amazon Comprehend","Amazon Polly"],"correctas":[0],"explicacion":"SageMaker cubre el ciclo completo para quien construye sus propios modelos. Los otros son servicios listos para usar que resuelven una tarea concreta sin entrenar nada.","referencia":"Amazon SageMaker"},{"id":"tec-48","dominio":"tecnologia","enunciado":"Una aplicación necesita detectar objetos y caras en fotografías. ¿Qué servicio corresponde?","opciones":["Amazon Rekognition","Amazon Textract","Amazon Comprehend","Amazon Transcribe"],"correctas":[0],"explicacion":"Rekognition analiza imágenes y video. Textract extrae texto y tablas de documentos, Comprehend analiza texto y Transcribe convierte voz en texto.","referencia":"Amazon Rekognition"},{"id":"tec-49","dominio":"tecnologia","enunciado":"¿Qué servicio convierte texto en voz con sonido natural?","opciones":["Amazon Polly","Amazon Transcribe","Amazon Lex","Amazon Translate"],"correctas":[0],"explicacion":"Polly genera audio a partir de texto. Transcribe hace lo contrario, Lex construye asistentes conversacionales y Translate traduce entre idiomas.","referencia":"Amazon Polly"},{"id":"tec-50","dominio":"tecnologia","enunciado":"¿Qué servicio ayuda a depurar aplicaciones distribuidas siguiendo el recorrido de una solicitud entre servicios?","opciones":["AWS X-Ray","Amazon CloudWatch","AWS CloudTrail","AWS Config"],"correctas":[0],"explicacion":"X-Ray traza la solicitud de extremo a extremo y muestra dónde se pierde el tiempo. Es la herramienta para saber cuál de los microservicios está frenando la respuesta.","referencia":"AWS X-Ray"},{"id":"tec-51","dominio":"tecnologia","enunciado":"¿Qué servicios forman parte de la cadena de integración y entrega continua de AWS? Selecciona dos.","opciones":["AWS CodePipeline","AWS CodeBuild","AWS CloudFormation","Amazon EventBridge"],"correctas":[0,1],"explicacion":"CodePipeline orquesta las etapas del despliegue y CodeBuild compila y ejecuta las pruebas. CodeDeploy completa la familia llevando el resultado a producción.","referencia":"AWS · Servicios de desarrollo"},{"id":"fac-06","dominio":"facturacion","enunciado":"¿Qué categorías incluye el nivel gratuito de AWS? Selecciona dos.","opciones":["Servicios siempre gratuitos hasta un límite mensual","Servicios gratuitos durante los primeros 12 meses desde la creación de la cuenta","Descuento permanente del 50 % en instancias reservadas","Soporte Enterprise sin costo el primer año"],"correctas":[0,1],"explicacion":"El nivel gratuito tiene tres categorías: siempre gratis, gratis 12 meses y pruebas de corta duración. No incluye descuentos en reservas ni planes de soporte de pago.","referencia":"Nivel gratuito de AWS"},{"id":"fac-07","dominio":"facturacion","enunciado":"¿Qué caracteriza al modelo de precios bajo demanda de EC2?","opciones":["Pagas por segundo o por hora sin compromiso, y puedes detener la instancia cuando quieras","Requiere un compromiso mínimo de un año","AWS puede reclamar la capacidad con dos minutos de aviso","Solo está disponible para cargas de trabajo por lotes"],"correctas":[0],"explicacion":"Bajo demanda es el modelo más caro por hora y el más flexible. Sirve para cargas impredecibles o de corta duración, y como punto de partida antes de medir el consumo real.","referencia":"EC2 · Bajo demanda"},{"id":"fac-08","dominio":"facturacion","enunciado":"¿Qué diferencia hay entre una instancia reservada estándar y una convertible?","opciones":["La convertible permite cambiar de familia o tipo de instancia durante el plazo, a cambio de un descuento algo menor","La estándar dura un año y la convertible tres","La convertible se puede interrumpir en cualquier momento","La estándar solo aplica a bases de datos"],"correctas":[0],"explicacion":"La estándar da el mayor descuento pero fija el tipo de instancia. La convertible cuesta un poco más porque conserva la flexibilidad de cambiar si la carga de trabajo evoluciona.","referencia":"EC2 · Instancias reservadas"},{"id":"fac-09","dominio":"facturacion","enunciado":"¿Qué son los Savings Plans?","opciones":["Un compromiso de gasto por hora durante uno o tres años a cambio de precios reducidos","Un descuento automático por pagar la factura por adelantado","Una reserva de capacidad garantizada en una zona de disponibilidad","Un plan de soporte técnico"],"correctas":[0],"explicacion":"Te comprometes a un importe por hora, no a un tipo de instancia concreto. Los Savings Plans de cómputo aplican además a Lambda y Fargate, no solo a EC2.","referencia":"Savings Plans"},{"id":"fac-10","dominio":"facturacion","enunciado":"¿En qué caso conviene un host dedicado?","opciones":["Cuando una licencia de software se cobra por servidor físico y hay que controlar en qué hardware se ejecuta","Cuando la carga de trabajo tolera interrupciones","Cuando se necesita el precio más bajo posible","Cuando la aplicación es sin servidor"],"correctas":[0],"explicacion":"El host dedicado da visibilidad del servidor físico, que es lo que exigen ciertas licencias de Windows Server u Oracle. Es la opción más cara y solo se justifica por ese motivo.","referencia":"EC2 · Hosts dedicados"},{"id":"fac-11","dominio":"facturacion","enunciado":"¿Qué herramienta permite visualizar y analizar el gasto histórico por servicio, cuenta o etiqueta?","opciones":["AWS Cost Explorer","AWS Budgets","AWS Pricing Calculator","AWS Compute Optimizer"],"correctas":[0],"explicacion":"Cost Explorer muestra hasta doce meses de historial con gráficos y también proyecta el gasto futuro. Budgets sirve para alertar, Cost Explorer para entender.","referencia":"AWS Cost Explorer"},{"id":"fac-12","dominio":"facturacion","enunciado":"¿Para qué sirven las etiquetas de asignación de costos?","opciones":["Marcar los recursos con pares clave-valor para desglosar la factura por proyecto, equipo o entorno","Cifrar los recursos etiquetados","Aplicar políticas de seguridad automáticamente","Reservar capacidad en una zona de disponibilidad"],"correctas":[0],"explicacion":"Sin etiquetas, la factura llega agrupada por servicio y no sabes qué proyecto gastó qué. Con una etiqueta de entorno o de área puedes repartir el costo dentro de la organización.","referencia":"Etiquetas de asignación de costos"},{"id":"fac-13","dominio":"facturacion","enunciado":"¿Qué servicio detecta gastos inusuales usando aprendizaje automático y avisa cuando algo se sale del patrón?","opciones":["AWS Cost Anomaly Detection","AWS Budgets","AWS Cost Explorer","AWS Trusted Advisor"],"correctas":[0],"explicacion":"Budgets avisa cuando cruzas un umbral que tú definiste. La detección de anomalías descubre picos que no habías previsto, como un recurso olvidado encendido.","referencia":"AWS Cost Anomaly Detection"},{"id":"fac-14","dominio":"facturacion","enunciado":"¿Qué incluye el plan de soporte Developer?","opciones":["Soporte técnico por correo en horario laboral, con un contacto principal","Soporte telefónico 24/7 y Trusted Advisor completo","Un administrador técnico de cuentas asignado","Solo documentación y foros, sin soporte técnico"],"correctas":[0],"explicacion":"Developer es el escalón más bajo de pago, pensado para entornos de prueba y desarrollo. El soporte telefónico y de chat las 24 horas empieza en Business.","referencia":"Planes de soporte de AWS"},{"id":"fac-15","dominio":"facturacion","enunciado":"¿Qué ofrece el plan de soporte Básico a todos los clientes de AWS?","opciones":["Documentación, foros, comprobaciones básicas de Trusted Advisor y soporte para asuntos de cuenta y facturación","Soporte técnico ilimitado por chat","Un administrador técnico de cuentas","Revisiones de arquitectura"],"correctas":[0],"explicacion":"El plan Básico no incluye soporte técnico sobre el uso de los servicios, pero sí atención en temas de cuenta y facturación, que es lo que suele confundirse.","referencia":"Planes de soporte de AWS"},{"id":"fac-16","dominio":"facturacion","enunciado":"¿Cómo cobra AWS la transferencia de datos en general?","opciones":["La entrada de datos a AWS suele ser gratuita, mientras que la salida hacia internet se cobra por gigabyte","Se cobra igual la entrada y la salida","Toda la transferencia es gratuita","Solo se cobra la transferencia dentro de la misma zona de disponibilidad"],"correctas":[0],"explicacion":"Es un patrón que conviene tener claro: subir datos no cuesta, sacarlos sí. Por eso reducir la salida, por ejemplo cacheando en CloudFront, tiene un impacto directo en la factura.","referencia":"Precios · Transferencia de datos"},{"id":"fac-17","dominio":"facturacion","enunciado":"¿Qué es AWS Marketplace?","opciones":["Un catálogo digital donde se encuentran y adquieren productos de software de terceros que corren en AWS","El portal donde se pagan las facturas de AWS","Una herramienta para estimar costos","El programa de socios certificados de AWS"],"correctas":[0],"explicacion":"Las compras del Marketplace se cobran en la misma factura de AWS, lo que simplifica la contratación y el control del gasto en software de terceros.","referencia":"AWS Marketplace"},{"id":"fac-18","dominio":"facturacion","enunciado":"Una empresa con varias cuentas en una organización quiere impedir que las cuentas de desarrollo lancen instancias caras. ¿Qué combinación lo resuelve?","opciones":["Una política de control de servicios que restrinja los tipos de instancia permitidos","Un presupuesto en AWS Budgets con alerta por correo","Etiquetas de asignación de costos en cada recurso","El plan de soporte Business"],"correctas":[0],"explicacion":"Budgets y las etiquetas informan después del gasto; la política de control de servicios lo impide antes. Para un límite que no se pueda saltar hace falta el control preventivo.","referencia":"AWS Organizations · Control de costos"},{"id":"seg-45","dominio":"seguridad","enunciado":"¿Qué servicio permite conectar un Active Directory corporativo con AWS para que las instancias Windows se unan al dominio?","opciones":["AWS Directory Service","Amazon Cognito","AWS IAM Identity Center","AWS Secrets Manager"],"correctas":[0],"explicacion":"Directory Service ofrece Microsoft AD gestionado en AWS o una conexión con el directorio local. Cognito es para usuarios de aplicaciones y IAM Identity Center para el acceso a cuentas de AWS.","referencia":"AWS Directory Service"}]};

/* ---------------- utilidades ---------------- */
const $ = (id) => document.getElementById(id);
const LETRAS = ["A", "B", "C", "D", "E", "F"];
const CLAVE = "repaso-aws:" + (BANCO.certificacion || "generico");
const UMBRAL = Number(BANCO.umbral) || 70;
const VERSION = "202609090406";

function barajar(lista) {
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function leerHistorial() {
  try {
    return JSON.parse(localStorage.getItem(CLAVE)) || { falladas: [], sesiones: [] };
  } catch (e) {
    return { falladas: [], sesiones: [] };
  }
}

function guardarHistorial(datos) {
  try { localStorage.setItem(CLAVE, JSON.stringify(datos)); } catch (e) { /* modo privado */ }
}

function nombreDominio(id) {
  const d = (BANCO.dominios || []).find((x) => x.id === id);
  return d ? d.nombre : id;
}

function mismasRespuestas(a, b) {
  if (a.length !== b.length) return false;
  const x = a.slice().sort(), y = b.slice().sort();
  return x.every((v, i) => v === y[i]);
}

/* ---------------- estado ---------------- */
let dominiosElegidos = new Set();
let modo = "estudio";
let sesion = null;

/* ---------------- portada ---------------- */
function pintarPortada() {
  $("sello-cert").textContent = BANCO.certificacion || "";
  $("titulo-cert").textContent = BANCO.titulo || "Repaso";
  $("desc-cert").textContent = BANCO.descripcion || "";

  const cont = $("chips-dominios");
  cont.innerHTML = "";
  (BANCO.dominios || []).forEach((d) => {
    const total = BANCO.preguntas.filter((p) => p.dominio === d.id).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", "true");
    b.dataset.dominio = d.id;
    b.innerHTML = d.nombre + '<span class="n">' + total + "</span>";
    b.addEventListener("click", () => {
      const activo = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", activo ? "false" : "true");
      if (activo) dominiosElegidos.delete(d.id); else dominiosElegidos.add(d.id);
      refrescarPortada();
    });
    dominiosElegidos.add(d.id);
    cont.appendChild(b);
  });

  document.querySelectorAll(".modo").forEach((b) => {
    b.addEventListener("click", () => {
      modo = b.dataset.modo;
      document.querySelectorAll(".modo").forEach((o) =>
        o.setAttribute("aria-pressed", o === b ? "true" : "false"));
    });
  });

  $("cuantas").addEventListener("input", (e) => { $("cuantas-valor").textContent = e.target.value; });
  $("sello-version").textContent = "versión " + VERSION;
  refrescarPortada();
}

function disponibles() {
  return BANCO.preguntas.filter((p) => dominiosElegidos.has(p.dominio));
}

function refrescarPortada() {
  const n = disponibles().length;
  const rango = $("cuantas");
  // Con bancos grandes el paso de 1 hace imposible acertar con el pulgar.
  rango.step = n > 40 ? 5 : 1;
  rango.max = Math.max(5, n);
  if (Number(rango.value) > n) { rango.value = n; }
  $("cuantas-valor").textContent = rango.value;
  $("btn-empezar").disabled = n === 0;
  $("btn-empezar").textContent = n === 0 ? "Elige al menos un dominio" : "Empezar";

  const hist = leerHistorial();
  const pendientes = hist.falladas.filter((id) => BANCO.preguntas.some((p) => p.id === id));
  $("btn-falladas").classList.toggle("oculto", pendientes.length === 0);
  $("btn-falladas").textContent = "Repasar las " + pendientes.length + " que fallé";

  if (hist.sesiones.length) {
    const u = hist.sesiones[hist.sesiones.length - 1];
    $("nota-historial").textContent =
      "Última sesión: " + u.aciertos + " de " + u.total + " (" + u.fecha + ").";
  } else {
    $("nota-historial").textContent = "";
  }
}

/* ---------------- sesión ---------------- */
function iniciarSesion(preguntas, etiqueta, modoSesion) {
  if (!preguntas.length) return;
  sesion = {
    modo: modoSesion,
    etiqueta: etiqueta,
    indice: 0,
    revisando: false,
    items: preguntas.map((p) => {
      const orden = barajar(p.opciones.map((_, i) => i));
      return {
        p: p,
        orden: orden,
        correctas: orden.reduce((acc, original, nuevo) => {
          if (p.correctas.includes(original)) acc.push(nuevo);
          return acc;
        }, []),
        elegidas: [],
        respondida: false
      };
    }),
    fin: modoSesion === "examen" ? Date.now() + preguntas.length * 120000 : null
  };
  mostrar("pantalla-pregunta");
  $("titulo-sesion").textContent = etiqueta;
  $("reloj").classList.toggle("oculto", modoSesion !== "examen");
  if (modoSesion === "examen") arrancarReloj();
  pintarPregunta();
}

let temporizador = null;
function arrancarReloj() {
  clearInterval(temporizador);
  const tic = () => {
    const resto = Math.max(0, sesion.fin - Date.now());
    const m = Math.floor(resto / 60000), s = Math.floor((resto % 60000) / 1000);
    $("reloj").textContent = "Tiempo restante " + m + ":" + String(s).padStart(2, "0");
    $("reloj").classList.toggle("urgente", resto < 120000);
    if (resto === 0) { clearInterval(temporizador); terminar(); }
  };
  tic();
  temporizador = setInterval(tic, 1000);
}

function pintarPregunta() {
  const it = sesion.items[sesion.indice];
  const p = it.p;
  const multiple = p.correctas.length > 1;

  $("contador").textContent = (sesion.indice + 1) + " / " + sesion.items.length;
  $("barra-progreso").style.width =
    ((sesion.indice) / sesion.items.length * 100) + "%";
  $("etiqueta-dominio").textContent = nombreDominio(p.dominio);
  $("enunciado").textContent = p.enunciado;
  $("aviso-multiple").classList.toggle("oculto", !multiple);

  if (p.imagen_datos) {
    $("diagrama").src = p.imagen_datos;
    $("marco-diagrama").classList.remove("oculto");
  } else {
    $("marco-diagrama").classList.add("oculto");
  }

  const cont = $("opciones");
  cont.innerHTML = "";
  it.orden.forEach((original, nuevo) => {
    const b = document.createElement("button");
    b.className = "opcion";
    b.setAttribute("aria-pressed", it.elegidas.includes(nuevo) ? "true" : "false");
    b.innerHTML = '<span class="letra">' + LETRAS[nuevo] + "</span><span></span>";
    b.lastChild.textContent = p.opciones[original];
    b.addEventListener("click", () => alternar(nuevo, multiple));
    cont.appendChild(b);
  });

  $("zona-explicacion").innerHTML = "";
  if (it.respondida) mostrarCorreccion();
  else actualizarBoton();
  ajustarEspacioInferior();
  window.scrollTo({ top: 0 });
}

function alternar(indice, multiple) {
  const it = sesion.items[sesion.indice];
  if (it.respondida) return;
  if (multiple) {
    const pos = it.elegidas.indexOf(indice);
    if (pos >= 0) it.elegidas.splice(pos, 1); else it.elegidas.push(indice);
  } else {
    it.elegidas = [indice];
  }
  document.querySelectorAll("#opciones .opcion").forEach((b, i) =>
    b.setAttribute("aria-pressed", it.elegidas.includes(i) ? "true" : "false"));
  actualizarBoton();
}

function actualizarBoton() {
  const it = sesion.items[sesion.indice];
  const btn = $("btn-accion");
  const ultima = sesion.indice === sesion.items.length - 1;

  if (sesion.revisando) {
    btn.disabled = false;
    btn.textContent = ultima ? "Volver al resultado" : "Siguiente";
    return;
  }
  if (sesion.modo === "examen") {
    btn.disabled = it.elegidas.length === 0;
    btn.textContent = ultima ? "Terminar" : "Siguiente";
    return;
  }
  if (it.respondida) {
    btn.disabled = false;
    btn.textContent = ultima ? "Ver resultado" : "Siguiente";
  } else {
    btn.disabled = it.elegidas.length === 0;
    btn.textContent = "Comprobar";
  }
}

function mostrarCorreccion() {
  const it = sesion.items[sesion.indice];
  const acerto = mismasRespuestas(it.elegidas, it.correctas);

  document.querySelectorAll("#opciones .opcion").forEach((b, i) => {
    b.disabled = true;
    b.setAttribute("aria-pressed", "false");
    if (it.correctas.includes(i)) b.dataset.estado = "ok";
    else if (it.elegidas.includes(i)) b.dataset.estado = "mal";
  });

  const caja = document.createElement("div");
  caja.className = "explicacion" + (acerto ? "" : " fallo");
  const veredicto = document.createElement("p");
  veredicto.className = "veredicto";
  veredicto.textContent = acerto ? "Correcto" : "No es esa";
  const texto = document.createElement("p");
  texto.textContent = it.p.explicacion || "";
  caja.appendChild(veredicto);
  caja.appendChild(texto);
  if (it.p.referencia) {
    const ref = document.createElement("span");
    ref.className = "ref";
    ref.textContent = it.p.referencia;
    caja.appendChild(ref);
  }
  $("zona-explicacion").innerHTML = "";
  $("zona-explicacion").appendChild(caja);
  actualizarBoton();
}

function accion() {
  const it = sesion.items[sesion.indice];
  const ultima = sesion.indice === sesion.items.length - 1;

  if (!sesion.revisando && sesion.modo === "estudio" && !it.respondida) {
    it.respondida = true;
    mostrarCorreccion();
    return;
  }
  if (!sesion.revisando && sesion.modo === "examen") it.respondida = true;

  if (ultima) {
    if (sesion.revisando) { sesion.revisando = false; mostrar("pantalla-resultado"); }
    else terminar();
    return;
  }
  sesion.indice++;
  pintarPregunta();
}

/* ---------------- resultado ---------------- */
function terminar() {
  clearInterval(temporizador);
  const total = sesion.items.length;
  const aciertos = sesion.items.filter((it) => mismasRespuestas(it.elegidas, it.correctas)).length;
  const pct = Math.round(aciertos / total * 100);

  $("cifra-puntaje").innerHTML = pct + "<small>%</small>";
  $("frase-puntaje").textContent = aciertos + " de " + total + " correctas";
  $("umbral").textContent = (pct >= UMBRAL ? "Por encima" : "Por debajo") +
    " del " + UMBRAL + " % orientativo de aprobación";

  const porDominio = {};
  sesion.items.forEach((it) => {
    const d = it.p.dominio;
    porDominio[d] = porDominio[d] || { ok: 0, n: 0 };
    porDominio[d].n++;
    if (mismasRespuestas(it.elegidas, it.correctas)) porDominio[d].ok++;
  });

  const cont = $("desglose-dominios");
  cont.innerHTML = "";
  Object.keys(porDominio).forEach((d) => {
    const { ok, n } = porDominio[d];
    const p = Math.round(ok / n * 100);
    const div = document.createElement("div");
    div.className = "dominio";
    div.innerHTML =
      '<div class="fila"><span></span><span>' + ok + "/" + n + "</span></div>" +
      '<div class="riel"><i style="width:' + p + '%"></i></div>';
    div.querySelector(".fila span").textContent = nombreDominio(d);
    const barra = div.querySelector(".riel i");
    barra.className = p >= UMBRAL ? "alto" : (p < 50 ? "bajo" : "");
    cont.appendChild(div);
  });

  const hist = leerHistorial();
  const falladas = new Set(hist.falladas);
  sesion.items.forEach((it) => {
    if (mismasRespuestas(it.elegidas, it.correctas)) falladas.delete(it.p.id);
    else falladas.add(it.p.id);
  });
  hist.falladas = Array.from(falladas);
  hist.sesiones.push({
    fecha: new Date().toLocaleDateString("es-CO"),
    aciertos: aciertos, total: total, modo: sesion.modo
  });
  hist.sesiones = hist.sesiones.slice(-20);
  guardarHistorial(hist);

  mostrar("pantalla-resultado");
}

/* ---------------- visor ---------------- */
let escala = 1;
function aplicarEscala() { $("img-visor").style.width = (100 * escala) + "%"; }

function abrirVisor(src) {
  $("img-visor").src = src;
  escala = 1;
  aplicarEscala();
  $("visor").classList.remove("oculto");
  document.body.style.overflow = "hidden";
}
function cerrarVisor() {
  $("visor").classList.add("oculto");
  document.body.style.overflow = "";
}

/* ---------------- ajuste al tamaño de texto del sistema ---------------- */
/* El pie es fijo y su altura cambia con el reloj y con la escala de texto que
   tenga el usuario, así que se mide en vez de asumirla. */
function ajustarEspacioInferior() {
  const pie = document.querySelector(".pie");
  const cuerpo = document.querySelector(".pregunta");
  if (pie && cuerpo) cuerpo.style.paddingBottom = (pie.offsetHeight + 24) + "px";
}

if (window.ResizeObserver) {
  const observador = new ResizeObserver(ajustarEspacioInferior);
  observador.observe(document.querySelector(".pie"));
} else {
  window.addEventListener("resize", ajustarEspacioInferior);
}
window.addEventListener("orientationchange", ajustarEspacioInferior);

/* ---------------- navegación ---------------- */
function mostrar(id) {
  ["pantalla-inicio", "pantalla-pregunta", "pantalla-resultado"]
    .forEach((s) => $(s).classList.toggle("oculto", s !== id));
  window.scrollTo({ top: 0 });
}

function volverInicio() {
  clearInterval(temporizador);
  sesion = null;
  refrescarPortada();
  mostrar("pantalla-inicio");
}

/* ---------------- arranque ---------------- */
pintarPortada();

$("btn-empezar").addEventListener("click", () => {
  const n = Number($("cuantas").value);
  const elegidas = barajar(disponibles()).slice(0, n);
  const etiqueta = modo === "examen" ? "Examen cronometrado" : "Sesión de estudio";
  iniciarSesion(elegidas, etiqueta, modo);
});

$("btn-falladas").addEventListener("click", () => {
  const hist = leerHistorial();
  const preguntas = BANCO.preguntas.filter((p) => hist.falladas.includes(p.id));
  iniciarSesion(barajar(preguntas), "Repaso de falladas", "estudio");
});

$("btn-accion").addEventListener("click", accion);
$("btn-salir").addEventListener("click", volverInicio);
$("btn-inicio").addEventListener("click", volverInicio);
$("btn-otra").addEventListener("click", volverInicio);

$("btn-revisar").addEventListener("click", () => {
  sesion.revisando = true;
  sesion.indice = 0;
  sesion.items.forEach((it) => { it.respondida = true; });
  mostrar("pantalla-pregunta");
  pintarPregunta();
});

$("btn-ampliar").addEventListener("click", () => abrirVisor($("diagrama").src));
$("diagrama").addEventListener("click", () => abrirVisor($("diagrama").src));
$("cerrar-visor").addEventListener("click", cerrarVisor);
$("zoom-mas").addEventListener("click", () => { escala = Math.min(escala * 1.4, 6); aplicarEscala(); });
$("zoom-menos").addEventListener("click", () => { escala = Math.max(escala / 1.4, 1); aplicarEscala(); });
$("zoom-ajustar").addEventListener("click", () => { escala = 1; aplicarEscala(); });

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("visor").classList.contains("oculto")) cerrarVisor();
});
</script>

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
