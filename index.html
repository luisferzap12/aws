<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Repaso AWS</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icono-192.png">
<style>
:root{
  --papel:#F5F6F4;
  --tinta:#17222B;
  --tenue:#5B7C99;
  --linea:#C9CEC9;
  --vpc:#3F6EA6;
  --acento:#E8873A;
  --ok:#2E7D5B;
  --ok-fondo:#EAF3EA;
  --err:#B23B3B;
  --err-fondo:#F8EBEB;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.app{max-width:640px;margin:0 auto;padding:0 18px;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--vpc);outline-offset:2px}
.oculto{display:none !important}

/* ---------- barra superior ---------- */
.cabecera{
  position:sticky;top:0;z-index:20;background:var(--papel);
  border-bottom:1px solid var(--linea);
}
.barra{
  display:flex;align-items:center;gap:12px;
  padding:14px 0 10px;
}
.barra .volver{
  background:none;border:none;padding:4px 6px 4px 0;font-size:20px;line-height:1;color:var(--tenue);
}
.barra .titulo{font-size:15px;font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .contador{font-family:var(--mono);font-size:13px;color:var(--tenue);white-space:nowrap}
.progreso{height:3px;background:var(--linea)}
.progreso i{display:block;height:100%;background:var(--vpc);width:0;transition:width .25s ease}

/* ---------- portada ---------- */
.portada{padding-top:28px;padding-bottom:40px}
.sello{
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--vpc);
  border:1px solid var(--vpc);border-radius:4px;padding:3px 8px;display:inline-block;
}
.portada h1{font-size:30px;line-height:1.15;margin:16px 0 6px;font-weight:650;letter-spacing:-.02em}
.portada p.sub{color:var(--tenue);margin:0 0 26px;max-width:44ch}

.bloque{margin-bottom:26px}
.bloque > h2{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--tenue)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--linea);background:#fff;border-radius:999px;
  padding:9px 14px;font-size:14px;
}
.chip[aria-pressed="true"]{border-color:var(--vpc);background:#E9EFF7;color:#1D4A78;font-weight:600}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--tenue);margin-left:6px}
.chip[aria-pressed="true"] .n{color:#1D4A78}

.modos{display:grid;gap:10px}
.modo{
  display:block;width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--linea);border-radius:8px;padding:14px 16px;
}
.modo[aria-pressed="true"]{border-color:var(--acento);background:#FDF1E7}
.modo b{display:block;font-size:16px;font-weight:600;margin-bottom:2px}
.modo span{font-size:13.5px;color:var(--tenue)}

.deslizador{display:flex;align-items:center;gap:14px}
.deslizador input{flex:1;accent-color:var(--vpc)}
.deslizador output{font-family:var(--mono);font-size:15px;min-width:2.5ch;text-align:right}

.principal{
  width:100%;border:none;border-radius:8px;background:var(--vpc);color:#fff;
  font-size:17px;font-weight:600;padding:16px;margin-top:6px;
}
.principal:disabled{background:var(--linea);color:#7C8A80}
.secundario{
  width:100%;border:1.5px solid var(--linea);border-radius:8px;background:#fff;
  font-size:15px;padding:13px;margin-top:10px;
}
.nota{font-size:13px;color:var(--tenue);margin-top:14px}

/* ---------- pregunta ---------- */
.pregunta{padding-top:18px;padding-bottom:130px}  /* el inferior lo recalcula el script */
.etiqueta-dominio{
  font-family:var(--mono);font-size:11.5px;color:var(--tenue);
  text-transform:none;margin-bottom:10px;display:block;
}
.enunciado{font-size:19px;line-height:1.45;margin:0 0 10px;font-weight:500;letter-spacing:-.01em}
.aviso-multiple{font-size:13.5px;color:var(--acento);font-weight:600;margin:0 0 14px}

.marco-diagrama{
  border:1.5px dashed var(--vpc);border-radius:8px;background:#fff;
  padding:8px;margin:0 0 18px;position:relative;
}
.marco-diagrama img{display:block;width:100%;height:auto;border-radius:4px}
.marco-diagrama .lupa{
  position:absolute;right:14px;bottom:14px;background:rgba(23,34,43,.82);color:#fff;
  border:none;border-radius:999px;font-size:12.5px;padding:7px 12px;
}

.opciones{display:grid;gap:10px;margin:0 0 18px}
.opcion{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--linea);border-radius:8px;
  padding:14px;min-height:56px;font-size:15.5px;line-height:1.45;
}
.opcion .letra{
  flex:0 0 auto;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--linea);
  display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--tenue);
}
.opcion[aria-pressed="true"]{border-color:var(--vpc);background:#E9EFF7}
.opcion[aria-pressed="true"] .letra{border-color:var(--vpc);background:var(--vpc);color:#fff}
.opcion[data-estado="ok"]{border-color:var(--ok);background:var(--ok-fondo)}
.opcion[data-estado="ok"] .letra{border-color:var(--ok);background:var(--ok);color:#fff}
.opcion[data-estado="mal"]{border-color:var(--err);background:var(--err-fondo)}
.opcion[data-estado="mal"] .letra{border-color:var(--err);background:var(--err);color:#fff}
.opcion[disabled]{cursor:default;opacity:1}

.explicacion{
  border-left:3px solid var(--ok);background:#fff;border-radius:0 8px 8px 0;
  padding:14px 16px;margin-bottom:18px;
}
.explicacion.fallo{border-left-color:var(--err)}
.explicacion .veredicto{font-weight:650;font-size:15px;margin:0 0 6px}
.explicacion p{margin:0;font-size:15px;line-height:1.5}
.explicacion .ref{
  font-family:var(--mono);font-size:12px;color:var(--tenue);margin-top:10px;display:block;
}

.pie{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:linear-gradient(to top,var(--papel) 72%,rgba(245,246,244,0));
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));
}
.pie .app{padding:0}
.reloj{
  font-family:var(--mono);font-size:13px;color:var(--tenue);
  text-align:center;margin-bottom:8px;
}
.reloj.urgente{color:var(--err);font-weight:600}

/* ---------- visor de diagrama ---------- */
.visor{
  position:fixed;inset:0;z-index:60;background:#0E161D;display:flex;flex-direction:column;
}
.visor .lienzo{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;display:grid;place-items:start center}
.visor img{background:#fff;border-radius:6px;display:block;transform-origin:top center}
.visor .controles{
  display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:#0E161D;border-top:1px solid #24343F;
}
.visor .controles button{
  flex:1;background:#1B2932;border:1px solid #33474F;color:#E7EDF2;
  border-radius:8px;padding:13px;font-size:15px;
}

/* ---------- resultados ---------- */
.resultado{padding-top:26px;padding-bottom:60px}
.marcador{text-align:center;margin-bottom:8px}
.marcador .cifra{font-size:60px;font-weight:650;line-height:1;letter-spacing:-.03em}
.marcador .cifra small{font-size:24px;font-weight:500;color:var(--tenue)}
.marcador .frase{color:var(--tenue);margin-top:8px;font-size:15px}
.umbral{
  font-family:var(--mono);font-size:12.5px;color:var(--tenue);
  text-align:center;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);
  padding:10px 0;margin:22px 0 26px;
}
.dominio{margin-bottom:16px}
.dominio .fila{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:6px}
.dominio .fila span:last-child{font-family:var(--mono);color:var(--tenue)}
.riel{height:9px;background:#E4E7E3;border-radius:999px;overflow:hidden}
.riel i{display:block;height:100%;background:var(--vpc);border-radius:999px}
.riel i.bajo{background:var(--err)}
.riel i.alto{background:var(--ok)}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<!-- ===================== PORTADA ===================== -->
<section id="pantalla-inicio">
  <div class="app portada">
    <span class="sello" id="sello-cert">SAA-C03</span>
    <h1 id="titulo-cert">AWS Solutions Architect</h1>
    <p class="sub" id="desc-cert"></p>

    <div class="bloque">
      <h2>Dominios que quieres repasar</h2>
      <div class="chips" id="chips-dominios"></div>
    </div>

    <div class="bloque">
      <h2>Cómo quieres practicar</h2>
      <div class="modos">
        <button class="modo" data-modo="estudio" aria-pressed="true">
          <b>Estudio</b>
          <span>Corriges pregunta por pregunta y lees la explicación al momento.</span>
        </button>
        <button class="modo" data-modo="examen" aria-pressed="false">
          <b>Examen cronometrado</b>
          <span>Dos minutos por pregunta, sin pistas. Las explicaciones llegan al final.</span>
        </button>
      </div>
    </div>

    <div class="bloque">
      <h2>Cuántas preguntas</h2>
      <div class="deslizador">
        <input type="range" id="cuantas" min="5" max="16" step="1" value="20" aria-label="Número de preguntas">
        <output id="cuantas-valor">20</output>
      </div>
    </div>

    <button class="principal" id="btn-empezar">Empezar</button>
    <button class="secundario oculto" id="btn-falladas">Repasar las que fallé</button>
    <p class="nota" id="nota-historial"></p>
    <p class="nota" id="sello-version" style="font-family:var(--mono);font-size:11.5px"></p>
  </div>
</section>

<!-- ===================== PREGUNTA ===================== -->
<section id="pantalla-pregunta" class="oculto">
  <div class="cabecera">
    <div class="app">
      <div class="barra">
        <button class="volver" id="btn-salir" aria-label="Salir de la sesión">←</button>
        <span class="titulo" id="titulo-sesion"></span>
        <span class="contador" id="contador"></span>
      </div>
    </div>
    <div class="progreso"><i id="barra-progreso"></i></div>
  </div>

  <div class="app pregunta">
    <span class="etiqueta-dominio" id="etiqueta-dominio"></span>
    <h2 class="enunciado" id="enunciado"></h2>
    <p class="aviso-multiple oculto" id="aviso-multiple">Selecciona dos respuestas</p>

    <div class="marco-diagrama oculto" id="marco-diagrama">
      <img id="diagrama" alt="Diagrama de arquitectura de la pregunta">
      <button class="lupa" id="btn-ampliar">Ampliar</button>
    </div>

    <div class="opciones" id="opciones"></div>
    <div id="zona-explicacion"></div>
  </div>

  <div class="pie">
    <div class="app">
      <div class="reloj oculto" id="reloj"></div>
      <button class="principal" id="btn-accion" disabled>Comprobar</button>
    </div>
  </div>
</section>

<!-- ===================== RESULTADOS ===================== -->
<section id="pantalla-resultado" class="oculto">
  <div class="cabecera">
    <div class="app">
      <div class="barra">
        <button class="volver" id="btn-inicio" aria-label="Volver al inicio">←</button>
        <span class="titulo">Resultado de la sesión</span>
      </div>
    </div>
  </div>
  <div class="app resultado">
    <div class="marcador">
      <div class="cifra" id="cifra-puntaje">0<small>%</small></div>
      <div class="frase" id="frase-puntaje"></div>
    </div>
    <div class="umbral" id="umbral"></div>
    <div id="desglose-dominios"></div>
    <button class="principal" id="btn-revisar">Revisar las respuestas</button>
    <button class="secundario" id="btn-otra">Otra sesión</button>
  </div>
</section>

<!-- ===================== VISOR ===================== -->
<div class="visor oculto" id="visor">
  <div class="lienzo" id="lienzo-visor"><img id="img-visor" alt="Diagrama ampliado"></div>
  <div class="controles">
    <button id="zoom-menos" aria-label="Reducir">−</button>
    <button id="zoom-ajustar">Ajustar</button>
    <button id="zoom-mas" aria-label="Ampliar">+</button>
    <button id="cerrar-visor">Cerrar</button>
  </div>
</div>

<script>
"use strict";

/* Los datos del banco los inyecta generar_app.py */
const BANCO = {"certificacion":"CLF-C02","titulo":"AWS Cloud Practitioner","descripcion":"Repaso del curso Cloud Practitioner Essentials, con el reparto de dominios del examen real.","umbral":70,"dominios":[{"id":"conceptos","nombre":"Conceptos de la nube","peso":24},{"id":"seguridad","nombre":"Seguridad y cumplimiento","peso":30},{"id":"tecnologia","nombre":"Tecnología y servicios","peso":34},{"id":"facturacion","nombre":"Facturación, precios y soporte","peso":12}],"preguntas":[{"id":"con-01","dominio":"conceptos","enunciado":"Una empresa migra de su propio centro de datos a AWS. ¿Qué cambio describe mejor el efecto sobre sus gastos?","opciones":["Pasa de gasto variable a gasto de capital anticipado","Pasa de gasto de capital anticipado a gasto variable según el consumo","Elimina por completo cualquier gasto en tecnología","Convierte los gastos operativos en inversión en hardware"],"correctas":[1],"explicacion":"Antes había que comprar servidores por adelantado sin saber cuánto se usarían: eso es gasto de capital. En la nube pagas por lo que consumes, cuando lo consumes. Es una de las ventajas que el examen repite con distintas palabras.","referencia":"Conceptos · Beneficios de la nube"},{"id":"con-02","dominio":"conceptos","enunciado":"AWS puede ofrecer precios más bajos que los que conseguiría una empresa comprando su propio hardware. ¿A qué beneficio corresponde?","opciones":["Economías de escala masivas","Alta disponibilidad","Tolerancia a fallos","Elasticidad"],"correctas":[0],"explicacion":"AWS agrega el consumo de cientos de miles de clientes, compra a un volumen enorme y traslada parte de ese ahorro al precio. Es un beneficio económico, no técnico.","referencia":"Conceptos · Economías de escala"},{"id":"con-03","dominio":"conceptos","enunciado":"Un equipo necesitaba semanas para conseguir servidores de prueba y ahora los lanza en minutos. ¿Qué beneficio de la nube ilustra el caso?","opciones":["Agilidad y velocidad de aprovisionamiento","Cumplimiento normativo","Economías de escala","Facturación consolidada"],"correctas":[0],"explicacion":"Reducir el tiempo entre la idea y el recurso funcionando es agilidad. Permite experimentar barato: si la prueba falla, apagas los recursos y dejas de pagar.","referencia":"Conceptos · Agilidad"},{"id":"con-04","dominio":"conceptos","enunciado":"¿Qué describe la elasticidad en AWS?","opciones":["Distribuir la aplicación en varias zonas de disponibilidad","Añadir y quitar capacidad automáticamente según la demanda del momento","Cifrar los datos en reposo y en tránsito","Guardar copias de seguridad en otra región"],"correctas":[1],"explicacion":"La elasticidad es el ajuste automático en ambas direcciones: crece en el pico y se reduce cuando baja la demanda, para que dejes de pagar capacidad ociosa. No confundir con alta disponibilidad, que es seguir funcionando ante un fallo.","referencia":"Conceptos · Elasticidad"},{"id":"con-05","dominio":"conceptos","enunciado":"¿Cuál de estos NO es un pilar del AWS Well-Architected Framework?","opciones":["Excelencia operativa","Eficiencia del rendimiento","Sostenibilidad","Portabilidad entre proveedores"],"correctas":[3],"explicacion":"Los seis pilares son excelencia operativa, seguridad, fiabilidad, eficiencia del rendimiento, optimización de costos y sostenibilidad. La portabilidad entre proveedores no está entre ellos.","referencia":"Well-Architected Framework"},{"id":"con-06","dominio":"conceptos","enunciado":"Una empresa mantiene su sistema contable en su propio centro de datos y ejecuta el sitio web en AWS, conectados entre sí. ¿Qué modelo de despliegue es?","opciones":["Nube pública","Nube híbrida","Local (on-premises)","Multinube"],"correctas":[1],"explicacion":"Combinar recursos en la nube con infraestructura propia conectada es un despliegue híbrido. Es habitual cuando una parte del sistema no se puede mover por normativa o por ser demasiado antigua.","referencia":"Conceptos · Modelos de despliegue"},{"id":"con-07","dominio":"conceptos","enunciado":"Amazon EC2, donde tú eliges el sistema operativo, lo parchas y administras la instancia, ¿a qué modelo de servicio corresponde?","opciones":["Infraestructura como servicio (IaaS)","Plataforma como servicio (PaaS)","Software como servicio (SaaS)","Función como servicio"],"correctas":[0],"explicacion":"IaaS entrega los bloques básicos de cómputo, red y almacenamiento, y el control del sistema operativo queda en tus manos. Si AWS gestionara el sistema operativo y solo desplegaras código, sería PaaS.","referencia":"Conceptos · Modelos de servicio"},{"id":"con-08","dominio":"conceptos","enunciado":"¿Qué principios de diseño en la nube recomienda AWS? Selecciona dos.","opciones":["Diseñar asumiendo que los componentes van a fallar","Desacoplar los componentes para que no dependan unos de otros","Concentrar toda la carga en una instancia grande para simplificar","Estimar la capacidad máxima al inicio y fijarla para todo el año"],"correctas":[0,1],"explicacion":"Diseñar para el fallo y desacoplar son dos principios centrales. Los otros dos son justamente los hábitos del centro de datos tradicional que la nube busca eliminar: escalar verticalmente sin límite y adivinar la capacidad por adelantado.","referencia":"Conceptos · Principios de diseño"},{"id":"con-09","dominio":"conceptos","enunciado":"Una startup quiere que su aplicación responda rápido a usuarios de Europa y Asia sin construir centros de datos allí. ¿Qué beneficio de la nube aprovecha?","opciones":["Alcance global en minutos","Facturación consolidada","Responsabilidad compartida","Reserva de capacidad a tres años"],"correctas":[0],"explicacion":"Desplegar en regiones cercanas al usuario, o distribuir contenido por las ubicaciones de borde, se hace en minutos y sin inversión previa. Es la ventaja de alcance global que el examen menciona como \"volverse global en minutos\".","referencia":"Conceptos · Alcance global"},{"id":"con-10","dominio":"conceptos","enunciado":"¿Qué significa que en la nube dejas de \"adivinar la capacidad\"?","opciones":["Que AWS decide automáticamente el presupuesto del proyecto","Que puedes ajustar los recursos hacia arriba o hacia abajo cuando cambie la demanda real","Que los recursos son gratuitos hasta cierto límite","Que ya no hace falta monitorear el rendimiento"],"correctas":[1],"explicacion":"En un centro de datos propio compras hardware basándote en una predicción: si te quedas corto, el servicio se degrada; si te pasas, pagaste de más. En la nube ajustas después, con datos reales de uso.","referencia":"Conceptos · Beneficios de la nube"},{"id":"seg-01","dominio":"seguridad","enunciado":"Según el modelo de responsabilidad compartida del diagrama, ¿quién debe instalar los parches del sistema operativo de una instancia EC2?","imagen":"responsabilidad-compartida.svg","opciones":["AWS, como parte de la seguridad de la nube","El cliente, como parte de la seguridad en la nube","El proveedor del sistema operativo directamente","Nadie: las instancias EC2 se actualizan solas"],"correctas":[1],"explicacion":"En EC2 el sistema operativo invitado es del cliente: tú lo eliges, lo configuras y lo parchas. AWS parchea el hipervisor y la infraestructura que hay debajo, no lo que corre dentro de tu instancia.","referencia":"Modelo de responsabilidad compartida","imagen_datos":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDcwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIFJvYm90bywgSGVsdmV0aWNhLCBBcmlhbCwgc2Fucy1zZXJpZiI+CiAgPHJlY3Qgd2lkdGg9IjcyMCIgaGVpZ2h0PSI0NzAiIGZpbGw9IiNmZmZmZmYiLz4KCiAgPCEtLSBDbGllbnRlIC0tPgogIDxyZWN0IHg9IjIwIiB5PSIyMCIgd2lkdGg9IjMzNiIgaGVpZ2h0PSI0MzAiIHJ4PSI4IiBmaWxsPSIjRkRGMUU3IiBzdHJva2U9IiNFODg3M0EiIHN0cm9rZS13aWR0aD0iMiIvPgogIDx0ZXh0IHg9IjE4OCIgeT0iNTAiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI2NTAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM5NjU0MUIiPkNsaWVudGU8L3RleHQ+CiAgPHRleHQgeD0iMTg4IiB5PSI3MiIgZm9udC1zaXplPSIxNCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzk2NTQxQiI+c2VndXJpZGFkIEVOI primer usuario IAM"],"correctas":[2],"explicacion":"El usuario raíz no se puede eliminar ni limitar con políticas, así que se protege con autenticación multifactor y se reserva para las pocas tareas que solo él puede hacer. El trabajo diario va con identidades de permisos acotados.","referencia":"IAM · Usuario raíz"},{"id":"seg-05","dominio":"seguridad","enunciado":"Otorgar a cada identidad únicamente los permisos que necesita para su tarea, y nada más, se conoce como:","opciones":["Autenticación multifactor","Principio de mínimo privilegio","Responsabilidad compartida","Federación de identidades"],"correctas":[1],"explicacion":"Es el principio base de IAM. Se empieza sin permisos y se van agregando los estrictamente necesarios, en vez de dar acceso amplio y recortar después.","referencia":"IAM · Mínimo privilegio"},{"id":"seg-06","dominio":"seguridad","enunciado":"Una aplicación que corre en EC2 necesita acceder a un bucket de S3. ¿Cuál es la forma recomendada?","opciones":["Crear un usuario IAM y copiar sus claves de acceso a la instancia","Asignar un rol IAM a la instancia","Hacer público el bucket","Usar las credenciales del usuario raíz"],"correctas":[1],"explicacion":"Los roles entregan credenciales temporales que se renuevan solas, así no hay claves guardadas en el servidor que alguien pueda robar. Es el patrón que el examen espera siempre que un servicio de AWS deba hablar con otro.","referencia":"IAM · Roles"},{"id":"seg-07","dominio":"seguridad","enunciado":"Entran diez personas nuevas al equipo de desarrollo y todas necesitan los mismos permisos. ¿Cuál es la forma más eficiente de gestionarlo en IAM?","opciones":["Adjuntar la política a cada usuario por separado","Crear un grupo IAM con la política y agregar a los diez usuarios","Compartir un único usuario entre los diez","Darles acceso con el usuario raíz y revocarlo cada noche"],"correctas":[1],"explicacion":"El grupo IAM existe para eso: la política se mantiene en un solo lugar y todos los miembros la minio":"tecnologia","enunciado":"¿Qué servicio ofrece almacenamiento de objetos con durabilidad muy alta, ideal para imágenes, copias de seguridad y archivos estáticos?","opciones":["Amazon EBS","Amazon S3","Amazon EFS","Amazon RDS"],"correctas":[1],"explicacion":"S3 guarda objetos en buckets, sin límite práctico de tamaño total, y replica los datos dentro de la región. EBS y EFS son almacenamiento de archivos o de bloques pensados para conectarse a instancias.","referencia":"Amazon S3"},{"id":"tec-06","dominio":"tecnologia","enunciado":"¿Qué servicio proporciona un volumen de almacenamiento en bloque que se conecta a una única instancia EC2, como si fuera un disco?","opciones":["Amazon S3","Amazon EBS","Amazon Glacier","AWS Storage Gateway"],"correctas":[1],"explicacion":"EBS ofrece volúmenes de bloque que se montan en una instancia dentro de la misma zona de disponibilidad y persisten aunque la instancia se detenga. Para compartir un sistema de archivos entre varias instancias se usa EFS.","referencia":"Amazon EBS"},{"id":"tec-07","dominio":"tecnologia","enunciado":"Una aplicación necesita una base de datos NoSQL de clave-valor con latencia de milisegundos y escalado automático. ¿Cuál elegir?","opciones":["Amazon RDS","Amazon Redshift","Amazon DynamoDB","Amazon Aurora"],"correctas":[2],"explicacion":"DynamoDB es la base NoSQL gestionada de AWS, sin servidores que administrar. RDS y Aurora son relacionales; Redshift es un almacén de datos para analítica.","referencia":"Amazon DynamoDB"},{"id":"tec-08","dominio":"tecnologia","enunciado":"El equipo de datos quiere ejecutar consultas analíticas sobre terabytes de información histórica de ventas. ¿Qué servicio está diseñado para eso?","opciones":["Amazon Redshift","Amazon DynamoDB","Amazon ElastiCache","Amazon Neptune"],"correctas":[0],"explicacion":"Redshift es el almacén de datos de AWS, optimizado para consultas analíticas sobre grandes volúmenes. Las bases transaccionales están pensadas para muchas operaciones pequeñas, no para agregaciones masivas.","referencia":"Amazon Redshift"},{"id":"tec-09","dominio":"tecnologia","enunciado":"¿Qué servicio permite crear una red aislada lógicamente dentro de AWS, con subredes y control de tráfico?","opciones":["Amazon Route 53","Amazon VPC","AWS Direct Connect","Elastic Load Balancing"],"correctas":[1],"explicacion":"VPC es tu red privada en AWS: defines el rango de direcciones, las subredes y las reglas de entrada y salida. Route 53 resuelve nombres de dominio y Direct Connect es una conexión dedicada desde tus instalaciones.","referencia":"Amazon VPC"},{"id":"tec-10","dominio":"tecnologia","enunciado":"¿Qué servicio registra quién hizo cada llamada a la API de AWS, desde qué dirección IP y cuándo?","opciones":["Amazon CloudWatch","AWS CloudTrail","AWS Config","Amazon Inspector"],"correctas":[1],"explicacion":"CloudTrail es el registro de auditoría de acciones sobre la cuenta. CloudWatch, en cambio, recoge métricas y registros de rendimiento y dispara alarmas. Es una pareja que el examen confunde a propósito: CloudTrail responde quién hizo qué, CloudWatch responde cómo va.","referencia":"AWS CloudTrail"},{"id":"tec-11","dominio":"tecnologia","enunciado":"Se quiere recibir una alerta cuando el uso de CPU de una instancia supere el 80 % durante cinco minutos. ¿Qué servicio se usa?","opciones":["Amazon CloudWatch","AWS CloudTrail","AWS Artifact","AWS Organizations"],"correctas":[0],"explicacion":"CloudWatch recoge métricas y permite crear alarmas que notifican o disparan una acción cuando se cruza un umbral, por ejemplo escalar el grupo de Auto Scaling.","referencia":"Amazon CloudWatch"},{"id":"tec-12","dominio":"tecnologia","enunciado":"¿De qué formas se puede interactuar con los servicios de AWS? Selecciona dos.","opciones":["Consola de administración en el navegador","Interfaz de línea de comandos (AWS CLI)","Conectándose por escritorio remoto al hipervisor","Enviando una solicitud escrita al soporte de AWS"],"correctas":[0,1],"explicacion":"Las tres vías oficiales son la consola, la CLI y los SDK para lenguajes de programación. Al hipervisor no accede ningún cliente: es infraestructura de AWS.","referencia":"Formas de acceso a AWS"},{"id":"tec-13","dominio":"tecnologia","enunciado":"El tráfico de un sitio web sube y baja mucho durante el día. ¿Qué combinación mantiene el rendimiento y evita pagar capacidad ociosa?","opciones":["Una sola instancia EC2 del tipo más grande disponible","Amazon EC2 Auto Scaling junto con Elastic Load Balancing","Amazon S3 con alojamiento de sitio estático únicamente","AWS Direct Connect hacia el centro de datos propio"],"correctas":[1],"explicacion":"Auto Scaling ajusta el número de instancias según la demanda y el balanceador reparte las solicitudes entre las que estén sanas. Una sola instancia grande no escala y además es un punto único de fallo.","referencia":"EC2 Auto Scaling y ELB"},{"id":"tec-14","dominio":"tecnologia","enunciado":"Una aplicación envía tareas a otro componente que las procesa a su propio ritmo, sin perder mensajes si el consumidor se cae. ¿Qué servicio corresponde?","opciones":["Amazon SQS","Amazon SNS","Amazon EventBridge","AWS Step Functions"],"correctas":[0],"explicacion":"SQS es una cola: los mensajes esperan hasta que alguien los procesa y confirma. SNS, en cambio, publica notificaciones a varios suscriptores a la vez y no las retiene esperando.","referencia":"Amazon SQS"},{"id":"fac-01","dominio":"facturacion","enunciado":"Una empresa con varias cuentas AWS quiere una sola factura y aprovechar los descuentos por volumen del uso combinado. ¿Qué le permite hacerlo?","imagen":"organizations-facturacion.svg","opciones":["La facturación consolidada de AWS Organizations","AWS Cost Explorer","El nivel gratuito de AWS","AWS Trusted Advisor"],"correctas":[0],"explicacion":"Organizations agrupa las cuentas bajo una cuenta de administración que recibe una factura única. Como el consumo se suma, es más fácil alcanzar los tramos de precio por volumen que si cada cuenta pagara aparte.","referencia":"AWS Organizations · Facturación consolidada","imagen_datos":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDIwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIFJvYm90bywgSGVsdmV0aWNhLCBBcmlhbCwgc2Fucy1zZXJpZiI+CiAgPHJlY3Qgd2lkdGg9IjcyMCIgaGVpZ2h0PSI0MjAiIGZpbGw9IiNmZmZmZmYiLz4KCiAgPHJlY3QgeD0iMjAiIHk9IjIwIiB3aWR0aD0iNjgwIiBoZWlnaHQ9IjM4MCIgcng9IjEwIiBmaWxsPSIjRjdGOUZCIiBzdHJva2U9IiMzRjZFQTYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWRhc2hhcnJheT0iNyA1Ii8+CiAgPHRleHQgeD0iNDAiIHk9IjQ4IiBmb250LXNpemU9IjE2IiBmb250LXdlaWdodD0iNjUwIiBmaWxsPSIjM0Y2RUE2Ij5Pcmdhbml6YWNpw7NuPC90ZXh0PgoKICA8IS0tIEN1ZW50YSBkZSBhZG1pbmlzdHJhY2lvbiAtLT4KICA8cmVjdCB4PSIyNDgiIHk9IjY4IiB3aWR0aD0iMjI0IiBoZWlnaHQ9IjY2IiByeD0iOCIgZmlsbD0iI0U5RUZGNyIgc3Ryb2tlPSIjM0Y2RUE2IiBzdHJva2Utd2lkdGg9IjIiLz4KICA8dGV4dCB4PSIzNjAiIHk9Ijk2IiBmb250LXNpemU9IjE1IiBmb250LXdlaWdodD0iNjAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMTcyMjJCIj5DdWVudGEgZGUgYWRtaW5pc3RyYWNpw7NuPC90ZXh0PgogIDx0ZXh0IHg9IjM2MCIgeT0iMTE4IiBmb250LXNpemU9IjEzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNUI3Qzk5Ij5yZWNpYmUgdW5hIHNvbGEgZmFjdHVyYTwvdGV4dD4KCiAgPCEtLSBPVXMgLS0+CiAgPHJlY3QgeD0iNjAiIHk9IjE5NiIgd2lkdGg9IjI3MCIgaGVpZ2h0PSIxODAiIHJ4PSI4IiBmaWxsPSIjZmZmZmZmIiBzdHJva2U9IiM1QjdDOTkiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWRhc2hhcnJheT0iNiA0Ii8+CiAgPHRleHQgeD0iODAiIHk9IjIyMiIgZm9udC1zaXplPSIxNCIgZm9udC13ZWlnaHQ9IjYwMCIgZmlsbD0iIzE3MjIyQiI+VW5pZGFkIG9yZ2FuaXphdGl2YTogUHJvZHVjY2nDs248L3RleHQ+CgogIDxyZWN0IHg9Ijg0IiB5PSIyMzgiIHdpZHRoPSIxMDQiIGhlaWdodD0iNTIiIHJ4PSI2IiBmaWxsPSIjRkRGMUU3IiBzdHJva2U9IiNFODg3M0EiIHN0cm9rZS13aWR0aD0iMS41Ii8+CiAgPHRleHQgeD0iMTM2IiB5PSIyNjIiIGZvbnQtc2l6ZT0iMTMiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMxNzIyMkIiPkN1ZW50YTwvdGV4dD4KICA8dGV4dCB4PSIxMzYiIHk9IjI3OSIgZm9udC1zaXplPSIxMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzVCN0M5OSI+dGllbmRhPC90ZXh0PgoKICA8cmVjdCB4PSIyMDIiIHk9IjIzOCIgd2lkdGg9IjEwNCIgaGVpZ2h0PSI1MiIgcng9IjYiIGZpbGw9IiNGREYxRTciIHN0cm9rZT0iI0U4ODczQSIgc ctas":[0],"explicacion":"Pricing Calculator estima el costo de una arquitectura que todavía no existe. Las otras tres trabajan sobre consumo real ya facturado.","referencia":"AWS Pricing Calculator"},{"id":"fac-05","dominio":"facturacion","enunciado":"¿Qué ofrece AWS Trusted Advisor?","opciones":["Informes de auditoría y certificaciones de cumplimiento","Recomendaciones sobre costos, rendimiento, seguridad, tolerancia a fallos y límites de servicio","Un canal de chat con ingenieros de soporte las 24 horas","Estimaciones de precio de arquitecturas nuevas"],"correctas":[1],"explicacion":"Trusted Advisor revisa la cuenta y sugiere mejoras en cinco categorías. Todas las cuentas ven un conjunto básico de comprobaciones; el catálogo completo llega con los planes Business y superiores.","referencia":"AWS Trusted Advisor"},{"id":"con-11","dominio":"conceptos","enunciado":"Una tienda en línea agrega más instancias EC2 pequeñas para atender el pico del Black Friday, en vez de cambiar a una instancia más potente. ¿Cómo se llama esa forma de escalar?","opciones":["Escalado horizontal","Escalado vertical","Escalado diagonal","Sobreaprovisionamiento"],"correctas":[0],"explicacion":"Escalar horizontalmente es sumar más instancias del mismo tamaño. Escalar verticalmente es cambiar una instancia por otra con más CPU o memoria, lo que obliga a detenerla y tiene un techo físico.","referencia":"Conceptos · Escalabilidad"},{"id":"con-12","dominio":"conceptos","enunciado":"¿Cuál es la diferencia entre alta disponibilidad y tolerancia a fallos?","opciones":["Son sinónimos, solo cambia el nombre según el servicio","La alta disponibilidad reduce al mínimo el tiempo de caída; la tolerancia a fallos permite seguir operando sin interrupción aunque falle un componente","La alta disponibilidad aplica a bases de datos y la tolerancia a fallos a redes","La tolerancia a fallos siempre es más barata"],"correctas":[1],"explicacion":"Un sistema de alta disponibilidad puede tener una interrupción breve mientras conmuta. Uno tolerante a fallos sigue respondiendo sin que el usuario note nada, y por eso cuesta más: exige componentes redundantes que no se usan la mayor parte del tiempo.","referencia":"Conceptos · Disponibilidad"},{"id":"con-13","dominio":"conceptos","enunciado":"¿Qué cubre el pilar de excelencia operativa del Well-Architected Framework?","opciones":["Ejecutar y supervisar sistemas, y mejorar los procesos y procedimientos de forma continua","Proteger los datos y los sistemas frente a accesos no autorizados","Usar los recursos de cómputo de forma eficiente","Evitar gastos innecesarios"],"correctas":[0],"explicacion":"La excelencia operativa trata sobre cómo opera el equipo: automatizar cambios, responder a eventos y aprender de los incidentes. Los otros tres enunciados describen los pilares de seguridad, eficiencia del rendimiento y optimización de costos.","referencia":"Well-Architected · Excelencia operativa"},{"id":"con-14","dominio":"conceptos","enunciado":"¿Qué pilar del Well-Architected Framework se ocupa de que una carga de trabajo se recupere de las interrupciones y cumpla con la demanda?","opciones":["Excelencia operativa","Fiabilidad","Eficiencia del rendimiento","Sostenibilidad"],"correctas":[1],"explicacion":"La fiabilidad cubre la recuperación ante fallos, la capacidad de adquirir recursos dinámicamente y la mitigación de interrupciones por configuración errónea o problemas de red.","referencia":"Well-Architected · Fiabilidad"},{"id":"con-15","dominio":"conceptos","enunciado":"Una empresa quiere reducir el impacto ambiental de sus cargas de trabajo. ¿Qué pilar del Well-Architected Framework la orienta?","opciones":["Optimización de costos","Fiabilidad","Sostenibilidad","Seguridad"],"correctas":[2],"explicacion":"El pilar de sostenibilidad, añadido en 2021, trata de minimizar el consumo energético y los recursos necesarios para la misma carga de trabajo. Suele coincidir con el ahorro de costos, pero es un pilar aparte.","referencia":"Well-Architected · Sostenibilidad"},{"id":"con-16","dominio":"conceptos","enunciado":"¿Qué herramienta permite revisar tus cargas de trabajo contra las mejores prácticas de AWS y obtener un plan de mejoras?","opciones":["AWS Well-Architected Tool","AWS Trusted Advisor","AWS Config","AWS Artifact"],"correctas":[0],"explicacion":"La Well-Architected Tool te hace un cuestionario por pilar y genera un informe con los riesgos detectados. Trusted Advisor, en cambio, analiza automáticamente los recursos que ya tienes desplegados.","referencia":"AWS Well-Architected Tool"},{"id":"con-17","dominio":"conceptos","enunciado":"¿Cuáles son perspectivas del AWS Cloud Adoption Framework? Selecciona dos.","opciones":["Personas","Gobernanza","Facturación","Redundancia"],"correctas":[0,1],"explicacion":"El CAF organiza la adopción de la nube en seis perspectivas: negocio, personas, gobernanza, plataforma, seguridad y operaciones. Las tres primeras se enfocan en capacidades organizativas y las tres últimas en capacidades técnicas.","referencia":"Cloud Adoption Framework"},{"id":"con-18","dominio":"conceptos","enunciado":"Una empresa mueve sus servidores virtuales a EC2 tal como están, sin modificar la aplicación. ¿Qué estrategia de migración es?","opciones":["Rehost, o \"levantar y mover\"","Replatform","Refactor","Repurchase"],"correctas":[0],"explicacion":"Rehost es la migración más rápida y la que menos beneficios de la nube aprovecha de entrada. Sirve para salir del centro de datos con prisa y optimizar después, ya estando en AWS.","referencia":"Estrategias de migración · Rehost"},{"id":"con-19","dominio":"conceptos","enunciado":"Al migrar, una empresa cambia su base de datos MySQL autogestionada por Amazon RDS, sin tocar el código de la aplicación. ¿Qué estrategia es?","opciones":["Rehost","Replatform","Refactor","Retire"],"correctas":[1],"explicacion":"Replatform hace algún ajuste para aprovechar servicios gestionados, pero conserva la arquitectura central de la aplicación. A veces se le llama \"lift, tinker and shift\".","referencia":"Estrategias de migración · Replatform"},{"id":"con-20","dominio":"conceptos","enunciado":"Una empresa reescribe su aplicación monolítica como microservicios sin servidor durante la migración. ¿Qué estrategia aplica?","opciones":["Rehost","Relocate","Refactor o rearquitectura","Retain"],"correctas":[2],"explicacion":"Refactor es la estrategia más costosa y lenta, pero la que más partido saca a la nube. Se justifica cuando la arquitectura actual impide crecer o agregar funciones.","referencia":"Estrategias de migración · Refactor"},{"id":"con-21","dominio":"conceptos","enunciado":"Durante el inventario previo a una migración, el equipo detecta aplicaciones que ya nadie usa. ¿Qué estrategia corresponde?","opciones":["Retain","Retire","Repurchase","Replatform"],"correctas":[1],"explicacion":"Retire es dar de baja lo que no aporta valor. Es la estrategia más barata de todas y suele financiar parte del resto de la migración.","referencia":"Estrategias de migración · Retire"},{"id":"con-22","dominio":"conceptos","enunciado":"Una aplicación no se puede migrar todavía por un contrato vigente con el proveedor. ¿Qué estrategia se aplica?","opciones":["Retire","Retain","Rehost","Refactor"],"correctas":[1],"explicacion":"Retain es dejar la aplicación donde está y revisarla más adelante. Es una decisión legítima, no un fracaso: reconoce que no todo tiene que migrar al mismo tiempo.","referencia":"Estrategias de migración · Retain"},{"id":"con-23","dominio":"conceptos","enunciado":"Una empresa reemplaza su CRM propio por una suscripción a un producto comercial en la nube. ¿Qué estrategia de migración es?","opciones":["Rehost","Replatform","Repurchase","Relocate"],"correctas":[2],"explicacion":"Repurchase es cambiar de producto, normalmente pasando a un modelo SaaS. Se deja de mantener software propio a cambio de adaptarse a lo que ofrece el proveedor.","referencia":"Estrategias de migración · Repurchase"},{"id":"con-24","dominio":"conceptos","enunciado":"Un servicio de correo electrónico al que accedes por navegador, sin instalar ni administrar nada, ¿a qué modelo corresponde?","opciones":["IaaS","PaaS","SaaS","Nube privada"],"correctas":[2],"explicacion":"En SaaS consumes la aplicación terminada y el proveedor se encarga de todo lo demás. Tu única responsabilidad es la gestión de usuarios y de tus datos.","referencia":"Conceptos · Modelos de servicio"},{"id":"con-25","dominio":"conceptos","enunciado":"Un desarrollador sube su código y la plataforma se encarga de aprovisionar servidores, balanceador y escalado. ¿Qué modelo de servicio es?","opciones":["IaaS","PaaS","SaaS","Colocación"],"correctas":[1],"explicacion":"En PaaS gestionas la aplicación y los datos, y el proveedor pone el sistema operativo, el tiempo de ejecución y la infraestructura. AWS Elastic Beanstalk es el ejemplo típico.","referencia":"Conceptos · Modelos de servicio"},{"id":"con-26","dominio":"conceptos","enunciado":"¿Qué caracteriza al modelo de despliegue de nube pública?","opciones":["La infraestructura es del proveedor y se comparte entre muchos clientes, cada uno aislado lógicamente","Cada cliente tiene servidores físicos exclusivos por defecto","Solo se puede usar desde un país","Requiere una conexión dedicada obligatoria"],"correctas":[0],"explicacion":"En la nube pública los recursos físicos se comparten, pero el aislamiento lógico impide que un cliente vea los datos de otro. Si necesitas hardware exclusivo por normativa, existen los hosts dedicados, que se pagan aparte.","referencia":"Conceptos · Modelos de despliegue"},{"id":"con-27","dominio":"conceptos","enunciado":"¿Qué significa \"autoservicio bajo demanda\" como característica de la nube?","opciones":["Puedes aprovisionar recursos cuando los necesitas, sin intervención humana del proveedor","Puedes llamar al soporte a cualquier hora","El proveedor te asigna recursos según un contrato anual","Los recursos se reparten equitativamente entre clientes"],"correctas":[0],"explicacion":"Lanzar una instancia o crear un bucket es una llamada a la API que se resuelve en segundos, sin tickets ni aprobaciones del proveedor. Esa inmediatez es la base de la agilidad de la nube.","referencia":"Conceptos · Características de la nube"},{"id":"con-28","dominio":"conceptos","enunciado":"¿Qué costos incluye el cálculo del costo total de propiedad al comparar un centro de datos propio con AWS? Selecciona dos.","opciones":["Energía, refrigeración y espacio físico","Personal dedicado a mantener el hardware","El precio de las acciones del proveedor","El costo de las licencias del navegador"],"correctas":[0,1],"explicacion":"El error habitual al comparar es mirar solo el precio del servidor. El costo total de propiedad incluye instalaciones, electricidad, red, reposición de hardware y el tiempo del equipo que lo mantiene.","referencia":"Conceptos · Costo total de propiedad"},{"id":"con-29","dominio":"conceptos","enunciado":"¿Qué ventaja tiene diseñar una aplicación con componentes sin estado?","opciones":["Cualquier instancia puede atender cualquier solicitud, lo que facilita escalar y reemplazar instancias","Reduce el costo del almacenamiento de objetos a la mitad","Elimina la necesidad de copias de seguridad","Garantiza que la aplicación nunca falle"],"correctas":[0],"explicacion":"Si la sesión del usuario no vive dentro de una instancia concreta, puedes agregar o quitar instancias sin romper nada. El estado se guarda aparte, por ejemplo en DynamoDB o ElastiCache.","referencia":"Conceptos · Diseño sin estado"},{"id":"con-30","dominio":"conceptos","enunciado":"¿Qué implica que un servicio sea \"sin servidor\" (serverless)?","opciones":["No administras servidores; el proveedor los aprovisiona, escala y parchea, y pagas por uso","No existe ningún servidor físico detrás","Es siempre gratuito","Solo funciona con lenguajes compilados"],"correctas":[0],"explicacion":"Los servidores existen, pero dejan de ser tu problema. Se acaba el aprovisionamiento, el parcheo y la planificación de capacidad, y cuando no hay ejecuciones no hay cobro por cómputo.","referencia":"Conceptos · Sin servidor"},{"id":"con-31","dominio":"conceptos","enunciado":"Una empresa usa AWS y otro proveedor de nube en paralelo, sin conectarlos con su centro de datos. ¿Cómo se llama ese enfoque?","opciones":["Nube híbrida","Multinube","Nube privada","Nube comunitaria"],"correctas":[1],"explicacion":"Multinube es usar varios proveedores de nube pública. Híbrida es combinar nube pública con infraestructura propia. La diferencia está en si hay o no un centro de datos propio en la ecuación.","referencia":"Conceptos · Modelos de despliegue"},{"id":"con-32","dominio":"conceptos","enunciado":"¿Qué beneficio económico se obtiene al dejar de operar un centro de datos propio?","opciones":["El equipo deja de invertir tiempo en tareas que no diferencian al negocio, como cablear y reemplazar discos","Se elimina la necesidad de medir el rendimiento","Los datos quedan automáticamente en cumplimiento con cualquier normativa","Desaparece la responsabilidad sobre la seguridad"],"correctas":[0],"explicacion":"AWS lo llama \"dejar de gastar dinero en operar centros de datos\". El valor no está solo en el ahorro directo, sino en dedicar a los clientes las horas que antes se iban en mantener hardware.","referencia":"Conceptos · Beneficios de la nube"},{"id":"con-33","dominio":"conceptos","enunciado":"¿Cuál de estas situaciones describe mejor el sobreaprovisionamiento que la nube ayuda a evitar?","opciones":["Comprar servidores para el pico de diciembre que quedan al 10 % de uso el resto del año","Contratar soporte técnico durante todo el año","Cifrar los datos en reposo y en tránsito","Repartir la aplicación entre dos zonas de disponibilidad"],"correctas":[0],"explicacion":"En un centro de datos propio hay que dimensionar para el pico, y esa capacidad se paga los doce meses. Con escalado automático la capacidad sigue a la demanda.","referencia":"Conceptos · Elasticidad"},{"id":"con-34","dominio":"conceptos","enunciado":"¿Qué describe mejor el modelo de precios \"pago por uso\" de AWS?","opciones":["Pagas por los recursos que consumes mientras los consumes, sin compromiso mínimo en la mayoría de servicios","Pagas una tarifa plana mensual por cuenta","Pagas solo cuando la aplicación tiene usuarios activos","Pagas por adelantado el consumo estimado del año"],"correctas":[0],"explicacion":"Es el modelo por defecto. Si necesitas menos, apagas recursos y el cobro baja. Los compromisos de uno o tres años existen, pero son opcionales y sirven para conseguir descuento.","referencia":"Conceptos · Pago por uso"},{"id":"con-35","dominio":"conceptos","enunciado":"Un equipo lanza un experimento, comprueba en dos semanas que la idea no funciona y apaga todo. ¿Qué ventaja de la nube hizo viable ese experimento?","opciones":["El bajo costo de fallar rápido, porque no hubo inversión previa en hardware","La facturación consolidada entre cuentas","El cifrado en reposo por defecto","La responsabilidad compartida"],"correctas":[0],"explicacion":"Probar una idea deja de requerir una compra de capital que hay que justificar y amortizar. Si sale mal, apagas los recursos y el gasto se detiene.","referencia":"Conceptos · Agilidad"},{"id":"con-36","dominio":"conceptos","enunciado":"¿Qué es una carga de trabajo en el vocabulario del Well-Architected Framework?","opciones":["Un conjunto de componentes que juntos entregan valor de negocio, como una aplicación y su infraestructura","Una sola instancia EC2","El total de la factura mensual","Un grupo de usuarios IAM"],"correctas":[0],"explicacion":"La revisión Well-Architected se hace por carga de trabajo, no por cuenta ni por servicio suelto. Una empresa suele tener varias, y cada una se evalúa contra los seis pilares por separado.","referencia":"Well-Architected · Vocabulario"},{"id":"seg-13","dominio":"seguridad","enunciado":"¿Qué servicio permite crear y controlar las claves de cifrado usadas por S3, EBS y otros servicios de AWS?","opciones":["AWS Key Management Service","AWS Secrets Manager","AWS Certificate Manager","AWS Artifact"],"correctas":[0],"explicacion":"KMS gestiona claves de cifrado y se integra con la mayoría de servicios de AWS. Cada uso de la clave queda registrado en CloudTrail, lo que sirve para auditoría.","referencia":"AWS KMS"},{"id":"seg-14","dominio":"seguridad","enunciado":"Una normativa exige que las claves de cifrado se guarden en un módulo de hardware de un solo inquilino, con certificación FIPS 140-2 nivel 3. ¿Qué servicio corresponde?","opciones":["AWS KMS con clave gestionada por AWS","AWS CloudHSM","AWS Secrets Manager","Amazon Macie"],"correctas":[1],"explicacion":"CloudHSM entrega módulos de hardware dedicados que solo tú controlas; ni AWS tiene acceso a las claves. KMS es multiinquilino y suficiente para la mayoría de casos, pero no cumple ese requisito específico.","referencia":"AWS CloudHSM"},{"id":"seg-15","dominio":"seguridad","enunciado":"¿Qué servicio guarda credenciales de bases de datos y las rota automáticamente sin cambiar el código de la aplicación?","opciones":["AWS Systems Manager Parameter Store","AWS Secrets Manager","AWS KMS","Amazon Cognito"],"correctas":[1],"explicacion":"Secrets Manager cifra el secreto y puede rotarlo con una función Lambda en un calendario definido. Parameter Store guarda configuración y también cifra, pero no rota por sí solo.","referencia":"AWS Secrets Manager"},{"id":"seg-16","dominio":"seguridad","enunciado":"¿Qué servicio aprovisiona y renueva automáticamente los certificados TLS públicos usados por un balanceador o CloudFront?","opciones":["AWS Certificate Manager","AWS KMS","AWS Shield","AWS Config"],"correctas":[0],"explicacion":"ACM emite certificados públicos sin costo para usarlos con servicios integrados de AWS, y los renueva antes de que caduquen. Elimina la causa más común de caídas por certificado vencido.","referencia":"AWS Certificate Manager"},{"id":"seg-17","dominio":"seguridad","enunciado":"Una empresa quiere descubrir si hay datos personales sin proteger dentro de sus buckets de S3. ¿Qué servicio usa?","opciones":["Amazon Inspector","Amazon Macie","Amazon GuardDuty","AWS Config"],"correctas":[1],"explicacion":"Macie usa aprendizaje automático para identificar datos sensibles en S3, como documentos de identidad o números de tarjeta, y alerta sobre buckets mal configurados.","referencia":"Amazon Macie"},{"id":"seg-18","dominio":"seguridad","enunciado":"¿Qué servicio analiza instancias EC2 y funciones Lambda en busca de vulnerabilidades de software conocidas?","opciones":["Amazon Inspector","Amazon Macie","AWS Artifact","AWS Trusted Advisor"],"correctas":[0],"explicacion":"Inspector evalúa de forma continua las cargas de trabajo contra bases de datos de vulnerabilidades y las prioriza por riesgo. Macie mira datos, Inspector mira software.","referencia":"Amazon Inspector"},{"id":"seg-19","dominio":"seguridad","enunciado":"¿Qué servicio centraliza los hallazgos de seguridad de GuardDuty, Inspector y Macie en un solo panel?","opciones":["AWS Security Hub","Amazon Detective","AWS Config","AWS Organizations"],"correctas":[0],"explicacion":"Security Hub agrega y prioriza hallazgos de varios servicios y comprueba tu entorno contra estándares como los CIS Benchmarks. Es la vista de conjunto de la postura de seguridad.","referencia":"AWS Security Hub"},{"id":"seg-20","dominio":"seguridad","enunciado":"Después de un hallazgo de seguridad, el equipo necesita investigar la causa raíz analizando relaciones entre eventos. ¿Qué servicio está diseñado para eso?","opciones":["AWS Security Hub","Amazon Detective","AWS Config","Amazon Inspector"],"correctas":[1],"explicacion":"Detective construye automáticamente un grafo con los datos de CloudTrail, los registros de flujo de VPC y GuardDuty, para investigar qué ocurrió. Security Hub te dice qué pasó; Detective te ayuda a entender por qué.","referencia":"Amazon Detective"},{"id":"seg-21","dominio":"seguridad","enunciado":"¿Qué servicio registra la configuración de tus recursos a lo largo del tiempo y evalúa si cumplen reglas definidas?","opciones":["AWS Config","AWS CloudTrail","Amazon CloudWatch","AWS Systems Manager"],"correctas":[0],"explicacion":"Config guarda el historial de configuración de cada recurso y alerta cuando algo se desvía de una regla, por ejemplo un bucket que deja de tener cifrado activo. CloudTrail registra las llamadas a la API; Config registra el estado resultante.","referencia":"AWS Config"},{"id":"seg-22","dominio":"seguridad","enunciado":"¿Qué permite AWS IAM Identity Center?","opciones":["Gestionar el acceso de los usuarios a varias cuentas de AWS desde un único lugar, con inicio de sesión federado","Crear una VPN entre cuentas","Cifrar los volúmenes EBS automáticamente","Descargar informes de cumplimiento"],"correctas":[0],"explicacion":"IAM Identity Center, antes AWS SSO, conecta con un directorio corporativo o mantiene el suyo propio y asigna permisos a varias cuentas de la organización. Evita crear usuarios IAM sueltos en cada cuenta.","referencia":"AWS IAM Identity Center"},{"id":"seg-23","dominio":"seguridad","enunciado":"Una empresa quiere que sus empleados accedan a AWS con las credenciales de su Active Directory corporativo. ¿Cómo se llama ese enfoque?","opciones":["Federación de identidades","Autenticación multifactor","Escalada de privilegios","Facturación consolidada"],"correctas":[0],"explicacion":"La federación permite reutilizar un proveedor de identidad existente en lugar de duplicar usuarios en AWS. Cuando alguien deja la empresa, se desactiva en el directorio y pierde el acceso a AWS de inmediato.","referencia":"IAM · Federación"},{"id":"seg-24","dominio":"seguridad","enunciado":"¿Qué añade la autenticación multifactor a una cuenta?","opciones":["Exige un segundo factor además de la contraseña, como un código temporal o una llave física","Cifra los datos almacenados en S3","Duplica los permisos del usuario","Permite compartir la cuenta entre dos personas"],"correctas":[0],"explicacion":"Con MFA activo, robar la contraseña no basta para entrar. AWS lo recomienda de forma obligatoria en el usuario raíz y en cualquier identidad con permisos amplios.","referencia":"IAM · MFA"},{"id":"seg-25","dominio":"seguridad","enunciado":"¿Qué es una política IAM?","opciones":["Un documento en formato JSON que define qué acciones se permiten o deniegan sobre qué recursos","Un contrato de soporte con AWS","Un informe de cumplimiento","Una regla de firewall a nivel de subred"],"correctas":[0],"explicacion":"Las políticas se adjuntan a usuarios, grupos o roles, y también a recursos como un bucket. Es el mecanismo con el que se aplica el principio de mínimo privilegio.","referencia":"IAM · Políticas"},{"id":"seg-26","dominio":"seguridad","enunciado":"Cuando una política deniega explícitamente una acción y otra la permite, ¿qué ocurre?","opciones":["La denegación explícita siempre gana","Gana la política creada más recientemente","Gana la política adjunta al usuario sobre la del grupo","Se produce un error y ninguna se aplica"],"correctas":[0],"explicacion":"La lógica de evaluación de IAM es: todo está denegado por defecto, un permiso explícito lo habilita, y una denegación explícita lo anula todo. Por eso las denegaciones sirven como barrera de seguridad.","referencia":"IAM · Evaluación de políticas"},{"id":"seg-27","dominio":"seguridad","enunciado":"¿Qué permiten las políticas de control de servicios en AWS Organizations?","opciones":["Fijar el límite máximo de permisos disponibles para las cuentas de una unidad organizativa","Otorgar permisos directamente a los usuarios","Reducir la factura mensual","Cifrar el tráfico entre cuentas"],"correctas":[0],"explicacion":"Una política de control de servicios no concede permisos: define el techo. Aunque un administrador de una cuenta hija se dé permisos totales, no podrá superar lo que la política permite.","referencia":"AWS Organizations · SCP"},{"id":"seg-28","dominio":"seguridad","enunciado":"¿Qué servicio ayuda a identificar recursos compartidos con entidades externas a tu organización, como un bucket accesible desde otra cuenta?","opciones":["IAM Access Analyzer","Amazon Inspector","AWS Artifact","Amazon Detective"],"correctas":[0],"explicacion":"Access Analyzer revisa las políticas basadas en recursos y señala los accesos desde fuera de tu zona de confianza. Sirve para encontrar permisos amplios que nadie recuerda haber configurado.","referencia":"IAM Access Analyzer"},{"id":"seg-29","dominio":"seguridad","enunciado":"¿Qué es el cifrado en reposo?","opciones":["Proteger los datos mientras están almacenados en disco o en un servicio de almacenamiento","Proteger los datos mientras viajan por la red","Ocultar los datos con una contraseña de aplicación","Comprimir los datos para ahorrar espacio"],"correctas":[0],"explicacion":"En reposo protege lo almacenado; en tránsito protege lo que viaja, normalmente con TLS. Una arquitectura segura usa los dos, no uno u otro.","referencia":"Seguridad · Cifrado"},{"id":"seg-30","dominio":"seguridad","enunciado":"¿Cuál de estas opciones protege los datos en tránsito?","opciones":["Habilitar el cifrado del volumen EBS","Usar HTTPS con TLS entre el cliente y el servidor","Activar el versionado del bucket","Guardar copias de seguridad en otra región"],"correctas":[1],"explicacion":"TLS cifra la comunicación mientras viaja por la red. El cifrado de EBS o de S3 protege lo almacenado, que es un problema distinto.","referencia":"Seguridad · Cifrado en tránsito"},{"id":"seg-31","dominio":"seguridad","enunciado":"Según el modelo de responsabilidad compartida, ¿de qué se encarga el cliente al usar AWS Lambda?","imagen":"responsabilidad-compartida.svg","opciones":["Del código de la función y de los permisos que le asigna","De parchear el sistema operativo donde corre la función","De aplicar actualizaciones al tiempo de ejecución del lenguaje","Del mantenimiento del hardware"],"correctas":[0],"explicacion":"Cuanto más gestionado es el servicio, menos queda del lado del cliente. En Lambda solo eres responsable del código, sus dependencias, la configuración y el rol de ejecución.","referencia":"Responsabilidad compartida · Lambda","imagen_datos":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDcwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIFJvYm90bywgSGVsdmV0aWNhLCBBcmlhbCwgc2Fucy1zZXJpZiI+CiAgPHJlY3Qgd2lkdGg9IjcyMCIgaGVpZ2h0PSI0NzAiIGZpbGw9IiNmZmZmZmYiLz4KCiAgPCEtLSBDbGllbnRlIC0tPgogIDxyZWN0IHg9IjIwIiB5PSIyMCIgd2lkdGg9IjMzNiIgaGVpZ2h0PSI0MzAiIHJ4PSI4IiBmaWxsPSIjRkRGMUU3IiBzdHJva2U9IiNFODg3M0EiIHN0cm9rZS13aWR0aD0iMiIvPgogIDx0ZXh0IHg9IjE4OCIgeT0iNTAiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI2NTAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM5NjU0MUIiPkNsaWVudGU8L3RleHQ+CiAgPHRleHQgeD0iMTg4IiB5PSI3MiIgZm9udC1zaXplPSIxNCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzk2NTQxQiI+c2VndXJpZGFkIEVOIGxhIG51YmU8L3RleHQ+CgogIDxyZWN0IHg9IjQyIiB5PSI5MiIgd2lkdGg9IjI5MiIgaGVpZ2h0PSI1MiIgcng9IjYiIGZpbGw9IiNmZmZmZmYiIHN0cm9rZT0iI0U4ODczQSIgc3Ryb2tlLXdpZHRoPSIxLjUiLz4KICA8dGV4dCB4PSIxODgiIHk9IjEyNCIgZm9udC1zaXplPSIxNSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzE3MjIyQiI+RGF0b3MgZGVsIGNsaWVudGU8L3RleHQ+CgogIDxyZWN0IHg9IjQyIiB5PSIxNTYiIHdpZHRoPSIyOTIiIGhlaWdodD0iNTIiIHJ4PSI2IiBmaWxsPSIjZmZmZmZmIiBzdHJva2U9IiNFODg3M0EiIHN0cm9rZS13aWR0aD0iMS41Ii8+CiAgPHRleHQgeD0iMTg4IiB5PSIxODEiIGZvbnQtc2l6ZT0iMTUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMxNzIyMkIiPkFwbGljYWNpb25lcyBlIGlkZW50aWRhZGVzPC90ZXh0PgogIDx0ZXh0IHg9IjE4OCIgeT0iMTk5IiBmb250LXNpemU9IjEzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNUI3Qzk5Ij51c3Vhcmlvcywgcm9sZXMgeSBwZXJtaXNvcyBJQU08L3RleHQ+CgogIDxyZWN0IHg9IjQyIiB5PSIyMjAiIHdpZHRoPSIyOTIiIGhlaWdodD0iNTIiIHJ4PSI2IiBmaWxsPSIjZmZmZmZmIiBzdHJva2U9IiNFODg3M0EiIHN0cm9rZS13aWR0aD0iMS41Ii8+CiAgPHRleHQgeD0iMTg4IiB5PSIyNDUiIGZvbnQtc2l6ZT0iMTUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMxNzIyMkIiPlNpc3RlbWEgb3BlcmF0aXZvIGludml0YWRvPC90ZXh0PgogIDx0ZXh0IHg9IjE4OCIgeT0iMjYzIiBmb250LX ue se borren objetos","Bloquea el acceso desde otras regiones"],"correctas":[0],"explicacion":"Es una red de seguridad a nivel de cuenta o de bucket que anula configuraciones permisivas. Está activado por defecto en los buckets nuevos, y desactivarlo debería ser una decisión consciente.","referencia":"S3 · Bloqueo de acceso público"},{"id":"seg-33","dominio":"seguridad","enunciado":"¿Qué principio de seguridad consiste en aplicar varias capas de protección en lugar de depender de una sola?","opciones":["Defensa en profundidad","Mínimo privilegio","Responsabilidad compartida","Separación de funciones"],"correctas":[0],"explicacion":"Grupos de seguridad, ACL de red, WAF, cifrado y permisos IAM son capas distintas. Si una falla o se configura mal, las demás siguen conteniendo el problema.","referencia":"Seguridad · Defensa en profundidad"},{"id":"seg-34","dominio":"seguridad","enunciado":"¿Qué servicio gestiona el registro y la autenticación de los usuarios de una aplicación web o móvil?","opciones":["Amazon Cognito","AWS IAM","AWS Directory Service","Amazon Detective"],"correctas":[0],"explicacion":"Cognito es para los usuarios finales de tu aplicación; IAM es para quienes administran recursos de AWS. Confundirlos es un error frecuente en el examen.","referencia":"Amazon Cognito"},{"id":"seg-35","dominio":"seguridad","enunciado":"¿Cuáles son buenas prácticas con las claves de acceso de un usuario IAM? Selecciona dos.","opciones":["Rotarlas periódicamente","Eliminarlas si el usuario ya no las necesita","Publicarlas en el repositorio del proyecto para que el equipo las use","Crear una sola clave y compartirla entre todas las aplicaciones"],"correctas":[0,1],"explicacion":"Las claves estáticas son el vector de fuga más común, sobre todo cuando terminan en un repositorio público. Siempre que sea posible conviene usar roles en lugar de claves.","referencia":"IAM · Claves de acceso"},{"id":"seg-36","dominio":"seguridad","enunciado":"¿Qué añade AWS Shield Advanced frente a la protección estándar?","opciones":["Protección ante ataques mayores, informes detallados y acceso al equipo de respuesta de AWS","Cifrado de los volúmenes EBS","Análisis de vulnerabilidades del sistema operativo","Informes de cumplimiento descargables"],"correctas":[0],"explicacion":"Shield Standard viene incluido sin costo para todos los clientes. Advanced es un servicio de pago que además cubre económicamente los picos de facturación causados por un ataque.","referencia":"AWS Shield Advanced"},{"id":"seg-37","dominio":"seguridad","enunciado":"Una empresa quiere crear cuentas nuevas con seguridad, registro y estructura ya configurados según buenas prácticas, sin montarlo a mano cada vez. ¿Qué servicio usa?","opciones":["AWS Control Tower","AWS Organizations por sí solo","AWS Config","AWS Systems Manager"],"correctas":[0],"explicacion":"Control Tower construye sobre Organizations y automatiza la creación de cuentas con barreras de protección, registro centralizado y una zona de aterrizaje ya definida. Organizations agrupa cuentas, pero no configura nada por ti.","referencia":"AWS Control Tower"},{"id":"seg-38","dominio":"seguridad","enunciado":"Una empresa europea debe garantizar que ciertos datos no salgan de la Unión Europea. ¿Qué control de AWS lo hace posible?","opciones":["Elegir una región de la UE, ya que los datos no se mueven fuera de la región salvo que tú lo configures","Activar el cifrado en reposo","Contratar el plan de soporte Enterprise","Usar AWS Artifact"],"correctas":[0],"explicacion":"El cliente decide en qué región vive cada recurso, y AWS no replica los datos a otra región por su cuenta. El cifrado protege los datos, pero no determina dónde residen.","referencia":"Cumplimiento · Soberanía de datos"},{"id":"seg-39","dominio":"seguridad","enunciado":"¿Qué es un grupo de seguridad en AWS?","opciones":["Un firewall virtual con estado que controla el tráfico de entrada y salida de una interfaz de red","Un conjunto de usuarios IAM con los mismos permisos","Un grupo de instancias que escalan juntas","Una política de cifrado de volúmenes"],"correctas":[0],"explicacion":"A pesar del nombre, no tiene relación con los grupos IAM. Es stateful: si permites una conexión entrante, la respuesta sale sin necesidad de una regla adicional.","referencia":"VPC · Grupos de seguridad"},{"id":"seg-40","dominio":"seguridad","enunciado":"¿Qué servicio centraliza la configuración de reglas de WAF y de firewall en varias cuentas de una organización?","opciones":["AWS Firewall Manager","AWS Config","AWS Organizations","Amazon GuardDuty"],"correctas":[0],"explicacion":"Firewall Manager aplica un conjunto de reglas de forma uniforme en todas las cuentas y recursos nuevos, para que ninguna cuenta quede sin proteger por olvido.","referencia":"AWS Firewall Manager"},{"id":"seg-41","dominio":"seguridad","enunciado":"¿Qué informe de IAM muestra el estado de las contraseñas, las claves de acceso y el MFA de todos los usuarios de una cuenta?","opciones":["El informe de credenciales","El informe de facturación","El informe de Trusted Advisor","El informe de Artifact"],"correctas":[0],"explicacion":"El informe de credenciales se descarga como CSV y sirve para detectar usuarios sin MFA o con claves antiguas que nadie ha rotado.","referencia":"IAM · Informe de credenciales"},{"id":"seg-42","dominio":"seguridad","enunciado":"¿Cuáles de estas tareas de seguridad son responsabilidad de AWS? Selecciona dos.","imagen":"responsabilidad-compartida.svg","opciones":["Parchear el hipervisor que ejecuta las instancias","Destruir de forma segura los discos que se dan de baja","Definir las políticas IAM de la cuenta","Elegir en qué región se guardan los datos"],"correctas":[0,1],"explicacion":"Todo lo que está por debajo del sistema operativo invitado es de AWS. Las decisiones que se toman desde la consola o la API, incluida la región, son del cliente.","referencia":"Modelo de responsabilidad compartida","imagen_datos":"data:image/svg+xml;base64,PHN2ZyB4bWxuc
